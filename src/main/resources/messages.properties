# Validation Service Error Messages
# These messages serve as fallbacks when API-based error resolution fails

# Rule Service Error Messages
RULE_CODE_EXISTS=Rule with code '{0}' already exists for tenant {1}
RULE_STATE_LOCKED=Cannot update rule in state: {0}
INVALID_RULE_STRUCTURE=Invalid rule structure: {0}

# Temporal Policy Service Error Messages
TEMPORAL_POLICY_EXISTS=Temporal policy with code '{0}' already exists for tenant {1}
INVALID_TIMEZONE=Invalid timezone: {0}
INVALID_RRULE=Invalid RRULE format: {0}

# Reason Code Service Error Messages
REASON_CODE_EXISTS=Reason code with code '{0}' already exists for tenant {1}
CANNOT_DELETE_GLOBAL=Cannot delete global reason code

# Publish Service Error Messages
PUBLISH_JOB_EXISTS=Publish job with name '{0}' already exists for tenant {1}
PUBLISH_JOB_NOT_FOUND=Publish job not found: {0}
CANNOT_CANCEL_JOB=Cannot cancel job in state: {0}
CANNOT_PUBLISH_ARCHIVED=Cannot publish archived rules
RULE_VALIDATION_FAILED=Rule validation failed: {0}

# Assignment Service Error Messages
ASSIGNMENT_OVERLAP=Assignment time periods overlap

# Operator Service Error Messages
OPERATOR_EXISTS=Operator {0}@{1} already exists for tenant {2}
VALIDATION_ERROR=Validation failed: {0}
FINGERPRINT_ERROR=Failed to calculate operators fingerprint
INVALID_JSON_SCHEMA=Invalid JSON schema: {0}

# Generic Error Messages
RESOURCE_NOT_FOUND=Requested resource not found: {0}
BUSINESS_ERROR=Business logic error: {0}
SYSTEM_ERROR=An unexpected system error occurred