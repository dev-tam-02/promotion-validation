# Validation Service Configuration
# Database Strategy: JPA/MariaDB ONLY (MongoDB disabled)

spring:
  application:
    name: validation

  # MariaDB Secondary Database (for validation rules/metadata)
  datasource:
    url: ${DB_URL:jdbc:mariadb://promotion-mariadb:3306/validation?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: root
    password: ${DB_PASSWORD:123123a@}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false

  # Spring Batch Configuration
  batch:
    job:
      enabled: false  # Disable auto-start of jobs (we'll use scheduling)
    jdbc:
      initialize-schema: always  # Create Spring Batch tables if not exist

# Server Configuration
server:
  port: 16014

# Eureka Configuration
eureka:
  client:
    enabled: true
    healthcheck:
      enabled: true
    fetch-registry: true
    register-with-eureka: true
    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
    service-url:
      defaultZone: http://service-registry:8761/eureka
  instance:
    appname: ${spring.application.name}
    instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    status-page-url-path: ${management.endpoints.web.base-path}/info
    health-check-url-path: ${management.endpoints.web.base-path}/health
    virtual-host-name: ${spring.application.name}

# Management Configuration
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  health:
    mongo:
      enabled: false  # Disable MongoDB health check - using JPA/MariaDB only
  tracing:
    sampling:
      probability: 1.0
    brave:
      enabled: true
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ""

# Promix Platform Configuration
promix:
  # MongoDB Configuration - DISABLED (using JPA as primary database)
  mongo:
    enabled: false

  # JPA/MariaDB Configuration - Toggle ON/OFF
  # Set to false to disable JPA/MariaDB completely
  jpa:
    enabled: true  # Primary database for validation documents and metadata

  # Outbox Pattern Configuration (Custom Spring Batch implementation)
  outbox:
    batch:
      enabled: true                        # Enable batch processing
      chunk-size: 100                      # Events per processing batch
      page-size: 1000                      # Events per database read
      interval-ms: 60000                   # Processing interval in milliseconds (60000ms = 1 minute)
    cleanup:
      enabled: true                        # Enable automatic cleanup
      retention-period: 7d                 # Keep processed events for 7 days
      interval-ms: 21600000                # Cleanup interval in milliseconds (21600000ms = 6 hours)
    retry:
      max-attempts: 3                      # Maximum retry attempts

  # Kafka Configuration
  messaging:
    enabled: true
    avro:
      enabled: true  # Enable Avro support in promix-messaging
      producer:
        enabled: true  # Enable Avro producer factory
      consumer:
        enabled: true  # Enable Avro consumer factory
      schema-registry:
        url: embedded
    kafka:
      bootstrap-servers:
        - kafka-1:9092
        - kafka-2:9093
        - kafka-3:9094
      client-id: validation
      enable-avro: true

      # Producer Configuration
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: com.promix.platform.messaging.autoconfigure.serializer.OptimizedEmbeddedAvroSerializer
        acks: all
        retries: 5
        batch-size: 16384
        linger: 10
        compression-type: lz4
        buffer-memory: 33554432
        enable-idempotence: true
        max-in-flight: 5
        request-timeout: 30000
        delivery-timeout: 120000
        retry-backoff: 100
        use-avro: true

      # Consumer Configuration
      consumer:
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: com.promix.platform.messaging.autoconfigure.serializer.OptimizedEmbeddedAvroDeserializer
        group-id: validation-group
        auto-offset-reset: earliest
        enable-auto-commit: false
        max-poll: 500
        max-poll-interval: 300000
        fetch-min-bytes: 1
        fetch-max-bytes: 52428800
        fetch-max-wait: 500
        isolation-level: read_committed
        concurrency: 3
        batch-listener: true
        ack-mode: MANUAL_IMMEDIATE
        session-timeout: 30000
        heartbeat-interval: 10000
        use-avro: true
        specific-avro-reader: true

        # Retry Configuration
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.5
          max-interval: 5000

        # Error Handling
        error-handling:
          enable-dlq: true
          dlq-topic-suffix: _dlq
          dlq-partitioning-enabled: false
          max-failures: 3
          include-headers: true

    # Messaging Topics (for Spring property injection)
    topics:
      setting-validation-rule-events: promotion_validation_events

  # Cache Configuration
  cache:
    # MASTER SWITCH: Enable cache support globally
    enabled: true

    # Disable Caffeine to make Redisson the default cache manager
    caffeine:
      enabled: false

    # Disable standard Redis cache manager (using Redisson instead)
    redis:
      enabled: false
      cluster:
        nodes: []  # Empty to prevent initialization

    # Enable Redisson as the default cache manager
    redisson:
      enabled: true
      mode: CLUSTER
      password: ${REDIS_PASSWORD:}
      connection-timeout: 3000
      timeout: 3000
      retry-attempts: 3
      retry-interval: 1500
      default-ttl: 30m
      max-idle-time: 15m
      default-max-size: 1000
      codec: org.redisson.codec.JsonJacksonCodec
      pool:
        min-idle: 5
        max-pool-size: 50
      cluster:
        nodes:
          - redis://node1:6379
          - redis://node2:6380
          - redis://node3:6381
        max-redirections: 3
        scan-interval: 1000

# Kafka Topics Configuration
kafka:
  topics:
    # Standardized Topic Naming Convention
    # All commands (create, update, delete, rollback) go to single command topic
    # All results/events go to single events topic

    # Inbound Topics (Commands to consume)
    validation-command: promotion_validation_command

    # Outbound Topics (Events to publish)
    validation-events: promotion_validation_events

    # Dead Letter Queue Topics
    validation-command-dlq: promotion_validation_command_dlq
    validation-events-dlq: promotion_validation_events_dlq

  consumer:
    group-id: validation-group

  producer:
    client-id: validation-producer

# Idempotency Configuration
idempotency:
  ttl-minutes: 10080  # 7 days (7 * 24 * 60 = 10080 minutes)

# Resilience4j Configuration for Fact Resolvers
resilience4j:
  circuitbreaker:
    instances:
      segmentsCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - java.lang.Exception
  retry:
    instances:
      segmentsRetry:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.lang.Exception
  ratelimiter:
    instances:
      segmentsRateLimiter:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms

# Logging Configuration
logging:
  level:
    root: INFO
    # Enable DEBUG for Liquibase to see migration logs
    liquibase: INFO
    liquibase.changelog: DEBUG
    liquibase.executor: DEBUG
    # Enable DEBUG for Outbox Scheduler to see batch job execution logs
    com.promix.platform.outbox.autoconfigure.OutboxSchedulerConfiguration: DEBUG
    # Enable DEBUG for Spring Batch to see job execution details
    org.springframework.batch.core: DEBUG
    # Application logging
    vn.viettel.vds.promotion.validation: INFO
