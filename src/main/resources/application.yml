# Validation Service Configuration - Dual Database Strategy

spring:
  application:
    name: validation

  # MariaDB Secondary Database (for validation rules/metadata)
  datasource:
    url: ${DB_URL:jdbc:mariadb://promixhub.com:3306/validation?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: root
    password: ${DB_PASSWORD:123123a@}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

# Server Configuration
server:
  port: 16014

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka

# Promix Platform Configuration - Dual Database Toggle
promix:
  # MongoDB Configuration - Toggle ON/OFF
  # Set to false to disable MongoDB completely
  mongo:
    enabled: false  # Disabled - using JPA as primary
    outbox:
      enabled: false
      publisher: "kafka"

  # JPA/MariaDB Configuration - Toggle ON/OFF
  # Set to false to disable JPA/MariaDB completely
  jpa:
    enabled: true  # Primary database for validation documents and metadata

  # Outbox Pattern Configuration
  outbox:
    enabled: true                         # Disable MongoDB outbox (from promix-outbox-autoconfigure)
    jpa:
      enabled: true                        # Enable JPA outbox implementation
    batch:
      enabled: true                        # Enable batch processing
      chunk-size: 100                      # Events per processing batch
      page-size: 1000                      # Events per database read
      interval-ms: 60000                   # Processing interval in milliseconds (60000ms = 1 minute)
    cleanup:
      enabled: true                        # Enable automatic cleanup
      retention-period: 7d                 # Keep processed events for 7 days
      interval-ms: 21600000                # Cleanup interval in milliseconds (21600000ms = 6 hours)
    retry:
      max-attempts: 3                      # Maximum retry attempts
      initial-delay: 1m                    # Initial retry delay
      max-delay: 1h                        # Maximum retry delay
      multiplier: 2.0                      # Delay multiplier for exponential backoff

  # Kafka Configuration
  messaging:
    enabled: true
    avro:
      enabled: true  # Enable Avro support in promix-messaging
      producer:
        enabled: true  # Enable Avro producer factory
      consumer:
        enabled: true  # Enable Avro consumer factory
      schema-registry:
        url: embedded
    kafka:
      bootstrap-servers:
        - kafka-1:9092
        - kafka-2:9093
        - kafka-3:9094
      client-id: validation
      enable-avro: true

      # Producer Configuration
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: com.promix.platform.messaging.autoconfigure.serializer.OptimizedEmbeddedAvroSerializer
        acks: all
        retries: 5
        batch-size: 16384
        linger: 10
        buffer-memory: 33554432
        enable-idempotence: true
        max-in-flight: 5
        request-timeout: 30000
        delivery-timeout: 120000
        retry-backoff: 100
        use-avro: true

      # Consumer Configuration
      consumer:
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: com.promix.platform.messaging.autoconfigure.serializer.OptimizedEmbeddedAvroDeserializer
        group-id: validation-group
        auto-offset-reset: earliest
        enable-auto-commit: false
        max-poll: 500
        max-poll-interval: 300000
        fetch-min-bytes: 1
        fetch-max-bytes: 52428800
        fetch-max-wait: 500
        isolation-level: read_committed
        concurrency: 3
        batch-listener: true
        ack-mode: MANUAL_IMMEDIATE
        session-timeout: 30000
        heartbeat-interval: 10000
        use-avro: true
        specific-avro-reader: true

        # Retry Configuration
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.5
          max-interval: 5000

        # Error Handling
        error-handling:
          enable-dlq: true
          dlq-topic-suffix: _dlq
          dlq-partitioning-enabled: false
          max-failures: 3
          include-headers: true

  # Cache Configuration
  cache:
    redis:
      enabled: true
      prefix: "validation-cache:"
      default-ttl: 30m
      cluster:
        nodes:
          - node1:6379
          - node2:6380
          - node3:6381

# Mongock Configuration (DISABLED - using Liquibase from promix-data-jpa)
mongock:
  migration-scan-package:
    - vn.viettel.vds.promotion.validation.infrastructure.migration
  throw-exception-if-cannot-obtain-lock: true
  track-ignored: false
  enabled: false  # Disabled - using Liquibase from promix-data-jpa-starter
  transaction-enabled: false  # Disable transaction for standalone MongoDB

# Kafka Topics Configuration
kafka:
  topics:
    # Standardized Topic Naming Convention
    # All commands (create, update, delete, rollback) go to single command topic
    # All results/events go to single events topic

    # Inbound Topics (Commands to consume)
    validation-command: promotion_validation_command

    # Outbound Topics (Events to publish)
    validation-events: promotion_validation_events

    # Dead Letter Queue Topics
    validation-command-dlq: promotion_validation_command_dlq
    validation-events-dlq: promotion_validation_events_dlq

  consumer:
    group-id: validation-group

  producer:
    client-id: validation-producer

# Logging Configuration
logging:
  level:
    root: INFO
    # Enable DEBUG for Outbox Scheduler to see batch job execution logs
    com.promix.platform.outbox.autoconfigure.OutboxSchedulerConfiguration: DEBUG
    # Enable DEBUG for Spring Batch to see job execution details
    org.springframework.batch.core: DEBUG
    # Application logging
    vn.viettel.vds.promotion.validation: INFO
