# Validation Service Configuration
# Database Strategy: JPA/MariaDB ONLY (MongoDB disabled)

spring:
  # Exclude Zipkin auto-configuration to prevent connection attempts
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
  application:
    name: validation
    context-path: /promotion/promotion-validation

  # MariaDB Secondary Database (for validation rules/metadata)
  datasource:
    url: ${DB_URL:jdbc:mariadb://mariadb:3306/validation?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: root
    password: ${DB_PASSWORD:123123a@}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: true
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false

  # Spring Batch Configuration
  batch:
    job:
      enabled: false  # Disable auto-start of jobs (we'll use scheduling)
    jdbc:
      initialize-schema: always  # Create Spring Batch tables if not exist

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: ${spring.application.context-path}/v3/api-docs
  swagger-ui:
    path: ${spring.application.context-path}/swagger-ui.html

# Server Configuration
server:
  port: 16014

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 30000
      validation-engine:
        connect-timeout: 5000
        read-timeout: 30000

# Management Configuration
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  health:
    mongo:
      enabled: false  # Disable MongoDB health check - using JPA/MariaDB only
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false  # Completely disable Zipkin

# External Services Configuration (Direct URLs - no Eureka)
external:
  order-service:
    url: ${ORDER_SERVICE_URL:http://staging-promotion-order-api-java:8080}
  customer-service:
    url: ${CUSTOMER_SERVICE_URL:http://staging-promotion-customer-api-java:8080}
  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://staging-promotion-product-api-java:8080}
  services:
    campaign:
      url: ${CAMPAIGN_SERVICE_URL:http://staging-promotion-campaign-api-java:8080}

# Promix Platform Configuration
promix:
  security:
    jwt:
      enabled: true
      verify-signature: false
  # Outbox Configuration
  outbox:
    jpa:
      enabled: true
    batch:
      enabled: true
      chunk-size: 100
      page-size: 1000
      interval-ms: 60000
    cleanup:
      enabled: true
      retention-period: 7d
      interval-ms: 21600000
    retry:
      max-attempts: 3
      initial-delay: 1m
      max-delay: 1h
      multiplier: 2.0
    monitoring:
      enabled: true

  # Observer Configuration (Tracing, Logging, Metrics)
  observer:
    enabled: true
    logging:
      request-response:
        enabled: false  # Disable request/response logging
    tracing:
      enabled: true
      service-name: ${spring.application.name}

  # External Services Configuration
  validation:
    external:
      customer:
        url: ${CUSTOMER_SERVICE_URL:http://staging-promotion-customer-api-java:8080}  # Direct URL to customer service
        path: ${CUSTOMER_SERVICE_PATH:/api/v1/customers}  # Base path for customer API
      order:
        url: ${ORDER_SERVICE_URL:http://staging-promotion-order-api-java:8080}  # Direct URL to order service
        path: ${ORDER_SERVICE_PATH:/api/v1/orders}  # Base path for order API

  # MongoDB Configuration - DISABLED (using JPA as primary database)
  mongo:
    enabled: false

  # JPA/MariaDB Configuration - Toggle ON/OFF
  jpa:
    enabled: true  # Primary database for validation documents and metadata

  # Kafka Configuration
  messaging:
    enabled: true
    utils:
      enabled: true
    avro:
      enabled: false  # Disable Avro support - using JSON instead
      producer:
        enabled: false  # Disable Avro producer factory
      consumer:
        enabled: false  # Disable Avro consumer factory
    kafka:
      bootstrap-servers:
        - kafka-1:9192
        - kafka-2:9193
        - kafka-3:9194
      client-id: validation
      enable-avro: false

      # JSON Serialization/Deserialization Configuration
      # Use default values from promix-messaging (add-type-info: true, use-type-info-headers: true)

      # Security Configuration
      security:
        protocol: SASL_PLAINTEXT
      #
      # SASL Authentication Configuration
      sasl:
        enabled: true
        mechanism: PLAIN
        security-protocol: SASL_PLAINTEXT
        username: admin
        password: 123123a@

      # Producer Configuration
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        acks: all
        retries: 5
        batch-size: 16384
        linger: 10
        compression-type: lz4
        buffer-memory: 33554432
        enable-idempotence: true
        max-in-flight: 5
        request-timeout: 30000
        delivery-timeout: 120000
        retry-backoff: 100
        use-avro: false

      # Consumer Configuration
      consumer:
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        group-id: validation-group-local
        auto-offset-reset: latest
        enable-auto-commit: false
        max-poll: 500
        max-poll-interval: 300000
        fetch-min-bytes: 1
        fetch-max-bytes: 52428800
        fetch-max-wait: 500
        isolation-level: read_committed
        concurrency: 12
        batch-listener: false
        ack-mode: MANUAL_IMMEDIATE
        session-timeout: 30000
        heartbeat-interval: 10000
        use-avro: false

        # JSON deserializer configuration with error handling
        # Note: promix-messaging auto-wraps with ErrorHandlingDeserializer,
        # so value-deserializer should be the DELEGATE (JsonDeserializer), not ErrorHandlingDeserializer
        properties:
          spring.json.trusted.packages: "*"
          spring.json.use.type.headers: true
          spring.json.value.default.type: vn.viettel.vds.promotion.validation.command.ValidationRuleCommand

        # Retry Configuration
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.5
          max-interval: 5000

        # Error Handling
        error-handling:
          enable-dlq: true
          dlq-topic-suffix: _dlq
          dlq-partitioning-enabled: false
          max-failures: 3
          include-headers: true

    # Messaging Topics (for Spring property injection)
    topics:
      setting-validation-rule-events: promotion_validation_event

  # Cache Configuration
  cache:
    # MASTER SWITCH: Enable cache support globally
    enabled: true

    # Disable Caffeine to make Redisson the default cache manager
    caffeine:
      enabled: false

    # Disable standard Redis cache manager (using Redisson instead)
    redis:
      enabled: false
    # Enable Redisson as the default cache manager
    redisson:
      enabled: true
      mode: CLUSTER
      password: 123123a@
      connection-timeout: 3000
      timeout: 3000
      retry-attempts: 3
      retry-interval: 1500
      default-ttl: 30m
      max-idle-time: 15m
      default-max-size: 1000
      codec: org.redisson.codec.JsonJacksonCodec
      pool:
        min-idle: 5
        max-pool-size: 50
      cluster:
        nodes:
          - redis://node1:6379
          - redis://node2:6380
          - redis://node3:6381
        max-redirections: 3
        scan-interval: 1000

# Kafka Topics Configuration
kafka:
  topics:
    # Standardized Topic Naming Convention
    # All commands (create, update, delete, rollback) go to single command topic
    # All results/events go to single event topic

    # Inbound Topics (Commands to consume)
    validation-command: promotion_validation_command

    # Outbound Topics (Events to publish)
    validation-event: promotion_validation_event

    # Dead Letter Queue Topics
    validation-command-dlq: promotion_validation_command_dlq
    validation-event-dlq: promotion_validation_event_dlq

  consumer:
    group-id: validation-group-local

  producer:
    client-id: validation-producer

# Idempotency Configuration
idempotency:
  ttl-minutes: 10080  # 7 days (7 * 24 * 60 = 10080 minutes)

# Integration Configuration
# Note: FeignClient now uses direct URL instead of Eureka service discovery
# URL can be configured via url property
# Context path can be configured via service-path property
# Feign client timeout is configured via Spring Cloud Feign properties (feign.client.config)
integration:
  validation-engine:
    url: ${VALIDATION_ENGINE_URL:http://staging-promotion-rule-engine-api-java:8080}
    service-path: ${VALIDATION_ENGINE_SERVICE_PATH:/promotion/promotion-rule-engine}
    retry-attempts: 3
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60s
      sliding-window-size: 10
      minimum-number-of-calls: 10
  rule-engine:
    url: ${RULE_ENGINE_URL:http://staging-promotion-rule-engine-api-java:8080}
    service-path: ${RULE_ENGINE_SERVICE_PATH:/promotion/promotion-rule-engine}

# Tenant Configuration
tenant:
  default-tenant-id: default
  compiler-id: validation-service-compiler-v1

# Resilience4j Configuration for Fact Resolvers
resilience4j:
  circuitbreaker:
    instances:
      ruleEngine:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - java.lang.Exception
      segmentsCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - java.lang.Exception
  retry:
    instances:
      segmentsRetry:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.lang.Exception
  ratelimiter:
    instances:
      segmentsRateLimiter:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms

# Logging Configuration
logging:
  level:
    root: INFO
    # Enable DEBUG for Liquibase to see migration logs
    liquibase: INFO
    liquibase.changelog: DEBUG
    liquibase.executor: DEBUG
    # Outbox Scheduler logging - set to INFO to reduce noise
    com.promix.platform.outbox.autoconfigure.OutboxSchedulerConfiguration: INFO
    # Spring Batch logging - set to WARN to suppress verbose job execution logs
    org.springframework.batch.core: WARN
    # Application logging
    vn.viettel.vds.promotion.validation: DEBUG
    # Hibernate SQL debugging - to diagnose findById issue
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
