# Validation Service Configuration
spring:
  application:
    name: validation

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://root:123123a%40@mongodb:27017/validation?authSource=admin&retryWrites=false

# Mongock Configuration
mongock:
  migration-scan-package:
    - vn.viettel.vds.promotion.validation.infrastructure.migration
  throw-exception-if-cannot-obtain-lock: false
  track-ignored: false
  enabled: true
  transaction-enabled: false  # Disable transaction for standalone MongoDB

  # Messages Configuration for Error Message Fallbacks
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-duration: PT10M  # Cache for 10 minutes

  # MVC Configuration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

# Validation Engine Integration Configuration
validation:
  engine:
    base-url: ${VALIDATION_ENGINE_BASE_URL:http://validation:8094}
    timeout:
      connect: 5s
      read: 30s

# Fact Aggregation Configuration
fact:
  aggregation:
    cache:
      enabled: true
      default-ttl-seconds: 60
      max-size: 1000

    resolvers:
      customer:
        base-url: ${CUSTOMER_SERVICE_URL:http://customer-service:8080}
        timeout-ms: 3000
        enabled: true
        priority: 10

      order:
        base-url: ${ORDER_SERVICE_URL:http://order-service:8080}
        timeout-ms: 4000
        enabled: true
        priority: 20

      catalog:
        base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
        timeout-ms: 3000
        enabled: true
        priority: 15

      redemption:
        base-url: ${REDEMPTION_SERVICE_URL:http://redemption-service:8080}
        timeout-ms: 2000
        enabled: true
        priority: 30

    policy:
      default-timeout-ms: 10000
      allow-partial-results: true
      enable-fallback: true

# Promix Platform Configuration
promix:
  # Web Starter Configuration
  web:
    response-template-enabled: true
    request-trimming-enabled: true
    exception-handling-enabled: true
    response-template:
      include-metadata: false
      include-tracing: false

  # Error Starter Configuration
  error:
    mode: ${ERROR_MODE:hybrid}  # api, bundle, hybrid (updated default to hybrid)
    fallback-to-bundle: ${ERROR_FALLBACK_BUNDLE:true}

    # Dynamic refresh configuration (updated structure)
    refresh:
      rate: ${ERROR_REFRESH_RATE:3600000}  # Refresh rate in milliseconds (1 hour)

    # API-based message source configuration (updated structure)
    api:
      enabled: ${ERROR_API_ENABLED:true}  # Changed default to true for hybrid mode
      base-url: ${ERROR_API_URL:http://error}  # Updated default base URL
      fetch-path: ${ERROR_API_FETCH_PATH:/api/v1/message-source/fetch}  # Updated default path
      connect-timeout-ms: ${ERROR_API_CONNECT_TIMEOUT:2000}
      read-timeout-ms: ${ERROR_API_READ_TIMEOUT:3000}

  # Validation Starter Configuration
  validation:
    enabled: true
    fail-fast: false
    groups-enabled: true
    locale-enabled: true

  # Data MongoDB Starter Configuration
  data:
    mongodb:
      enabled: true
      repository-scan-enabled: true
      audit:
        enabled: true
        date-time-provider: system
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
      auto-index-creation: true

  # Resilience Starter Configuration
  resilience:
    enabled: true
    circuit-breaker:
      enabled: true
      default-config:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 60000
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 10
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        wait-duration-in-open-state: 60000
        automatic-transition-from-open-to-half-open-enabled: true
    retry:
      enabled: true
      default-config:
        max-attempts: 3
        wait-duration: 500
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

  # Messaging Starter Configuration
  messaging:
    enabled: true
    kafka:
      bootstrap-servers:
        - kafka-1:9092
        - kafka-2:9093
        - kafka-3:9094
      client-id: ${spring.application.name}
      consumer:
        group-id: validation-group
        concurrency: 1
        retry:
          max-attempts: 3
    topics:
      setting-validation-rule-commands: setting-validation-rule-commands
      setting-validation-rule-events: setting-validation-rule-events
      setting-validation-rule-commands-dlq: setting-validation-rule-commands-dlq

  # Cache Configuration
  cache:
    enabled: true
    caffeine:
      enabled: true
      maximum-size: 1000
      expire-after-write: 10m
    redis:
      enabled: true
      prefix: "validation-cache:"
      default-ttl: 30m
      timeout: 5s
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:node1:6379,node2:6380,node3:6381}
        max-redirects: 3
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3s

# Server Configuration
server:
  port: ${SERVER_PORT:6012}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true
    mime-types:
      - text/html
      - text/plain
      - text/css
      - application/json
      - application/xml
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

# Integration Services Configuration
integration:
  validation-engine:
    url: ${VALIDATION_ENGINE_URL:http://validation-engine:8082}
    timeout: PT30S
    retry-attempts: 3
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: PT60S
      sliding-window-size: 10
      minimum-number-of-calls: 10

  artifact-service:
    url: ${ARTIFACT_SERVICE_URL:http://artifact-service:8080}
    timeout-seconds: 30
    retry-attempts: 3

  redemption-service:
    url: ${REDEMPTION_SERVICE_URL:http://redemption-service:8080}
    timeout-seconds: 30
    retry-attempts: 3

  event-bus:
    url: ${EVENT_BUS_URL:http://event-bus:8080}
    timeout-seconds: 10
    retry-attempts: 2

# External Services Configuration
external:
  customer-service:
    url: ${CUSTOMER_SERVICE_URL:http://customer-service:8080}
    timeout-seconds: 10
    retry-attempts: 3

  order-service:
    url: ${ORDER_SERVICE_URL:http://order-service:8080}
    timeout-seconds: 10
    retry-attempts: 3

  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
    timeout-seconds: 10
    retry-attempts: 3

# Security Configuration
security:
  jwt:
    enabled: true
    secret: ${JWT_SECRET:validation-service-secret-key-2024}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    issuer: ${JWT_ISSUER:validation-service}

  cors:
    enabled: true
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "https://*.promix.vn"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

# Outbox Event Processing Configuration
outbox:
  processor:
    enabled: true
    batch-size: 50
    processing-interval-seconds: 30
    retry-interval-seconds: 60
    cleanup-interval-hours: 6
    retention-days: 7

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump,heapdump,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    diskspace:
      enabled: true
    db:
      enabled: true
    mongo:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: validation
    export:
      prometheus:
        enabled: true

    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: logs/validation-service.log
    max-size: 100MB
    max-history: 30

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 300
  instance:
    leaseRenewalIntervalInSeconds: 300
    leaseExpirationDurationInSeconds: 600
    hostname: ${spring.application.name}
    prefer-ip-address: true
