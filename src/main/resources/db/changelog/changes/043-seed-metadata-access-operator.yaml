databaseChangeLog:
  # ============================================================================
  # T16: Seed metadata.access operator + METADATA_MISMATCH reason code
  #
  # Generic translator MetadataAccessOperatorTranslator (pp-rule-engine) handles
  # operator name "metadata.access" for all virtual metadata options generated by T15.
  # One reason code covers all metadata field mismatches (generic, Pha 1).
  # ============================================================================

  - changeSet:
      id: 043-seed-metadata-access-reason-code
      author: harley hoang
      comment: Seed METADATA_MISMATCH generic reason code for T16 metadata.access operator
      changes:
        - insert:
            tableName: reason_codes
            columns:
              - column: { name: id, value: "rc-metadata-mismatch-001" }
              - column: { name: code, value: "METADATA_MISMATCH" }
              - column: { name: display_message, value: '{"vi":"Trường metadata không khớp điều kiện","en":"Customer or order metadata field does not match required value"}' }
              - column: { name: severity, value: "ERROR" }
              - column: { name: active, valueBoolean: true }
              - column: { name: created_at, valueDate: "2026-01-01T00:00:00" }
              - column: { name: updated_at, valueDate: "2026-01-01T00:00:00" }

      rollback:
        - delete:
            tableName: reason_codes
            where: "id = 'rc-metadata-mismatch-001'"
