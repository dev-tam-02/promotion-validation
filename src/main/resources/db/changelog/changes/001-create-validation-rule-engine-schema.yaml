databaseChangeLog:
  # ============================================================================
  # CORE VALIDATION RULES
  # ============================================================================

  - changeSet:
      id: 001-create-validation-rules-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_rules
            remarks: Validation rules with state management and versioning
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(100)
                  remarks: Rule code identifier
              - column:
                  name: name
                  type: varchar(200)
                  remarks: Rule name
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: varchar(20)
                  remarks: Rule state (DRAFT, PUBLISHED, ARCHIVED, DEPRECATED)
                  constraints:
                    nullable: false
              - column:
                  name: rule_version
                  type: bigint
                  remarks: Rule version number
                  constraints:
                    nullable: false
              - column:
                  name: logic
                  type: varchar(50)
                  remarks: Root logic for rule evaluation (ALL, ANY, NONE, XOR)
              - column:
                  name: dsl
                  type: text
                  remarks: DSL snapshot in JSON format
              - column:
                  name: bundle_hash
                  type: varchar(200)
                  remarks: Compiled DRL bundle hash
              - column:
                  name: published_at
                  type: timestamp
                  remarks: When rule was published
              - column:
                  name: published_by
                  type: varchar(100)
                  remarks: Who published the rule
              - column:
                  name: created_at
                  type: timestamp
                  remarks: Creation timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: Last update timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: Creator
              - column:
                  name: updated_by
                  type: varchar(100)
                  remarks: Last updater
              - column:
                  name: version
                  type: bigint
                  remarks: Optimistic locking version
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_validation_rules_state_version
            tableName: validation_rules
            columns:
              - column:
                  name: state
              - column:
                  name: rule_version
                  descending: true

        - createIndex:
            indexName: idx_validation_rules_code
            tableName: validation_rules
            unique: true
            columns:
              - column:
                  name: code

  # ============================================================================
  # RULE NODES (Tree structure for complex rules)
  # ============================================================================

  - changeSet:
      id: 001-create-rule-nodes-table
      author: harley hoang
      changes:
        - createTable:
            tableName: rule_nodes
            remarks: Rule nodes forming tree structure for complex rules
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: node_id
                  type: varchar(100)
                  remarks: Node identifier
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(20)
                  remarks: Node type (GROUP or COND)
                  constraints:
                    nullable: false
              - column:
                  name: group_logic
                  type: varchar(20)
                  remarks: Logic for GROUP type (ALL, ANY, NONE)
              - column:
                  name: children_ids
                  type: text
                  remarks: JSON array of child node IDs
              - column:
                  name: node_order
                  type: int
                  remarks: Order of node in parent
                  defaultValueNumeric: 0
              - column:
                  name: operator_name
                  type: varchar(100)
                  remarks: Operator name for COND type
              - column:
                  name: params
                  type: text
                  remarks: JSON parameters for operator
              - column:
                  name: reason_code
                  type: varchar(100)
                  remarks: Reason code for failed validation
              - column:
                  name: validation_rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rule_nodes_validation_rule
                    references: validation_rules(id)
              - column:
                  name: parent_id
                  type: varchar(36)
                  remarks: Self-referencing parent node
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: updated_by
                  type: varchar(100)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_rule_nodes_validation_rule_id
            tableName: rule_nodes
            columns:
              - column:
                  name: validation_rule_id

        - createIndex:
            indexName: idx_rule_nodes_parent_id
            tableName: rule_nodes
            columns:
              - column:
                  name: parent_id

        - createIndex:
            indexName: idx_rule_nodes_node_order
            tableName: rule_nodes
            columns:
              - column:
                  name: node_order

        - addForeignKeyConstraint:
            baseTableName: rule_nodes
            baseColumnNames: parent_id
            constraintName: fk_rule_nodes_parent
            referencedTableName: rule_nodes
            referencedColumnNames: id

  # ============================================================================
  # RULE USAGE LIMITS
  # ============================================================================

  - changeSet:
      id: 001-create-rule-usage-limits-table
      author: harley hoang
      changes:
        - createTable:
            tableName: rule_usage_limits
            remarks: Usage limits for validation rules
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: validation_rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_usage_limits_validation_rule
                    references: validation_rules(id)
              - column:
                  name: per_code_total
                  type: int
                  remarks: Total usage limit per code
              - column:
                  name: per_customer
                  type: int
                  remarks: Usage limit per customer
              - column:
                  name: per_day
                  type: int
                  remarks: Daily usage limit
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: Creator user ID
              - column:
                  name: updated_by
                  type: varchar(100)
                  remarks: Last updater user ID
              - column:
                  name: version
                  type: bigint
                  remarks: Optimistic locking version
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  # ============================================================================
  # RULE BINDINGS - NEW UNIFIED TABLE
  # Replaces: assignments, rule_assignments, temporal_policies,
  #           rule_temporal_links, assignment_applicability_rules
  # ============================================================================

  - changeSet:
      id: 001-create-rule-bindings-table
      author: harley hoang
      changes:
        - createTable:
            tableName: rule_bindings
            remarks: >
              Unified table for binding rules to targets with time constraints and product scope.
              Replaces multiple legacy tables: assignments, temporal_policies, rule_temporal_links, etc.
            columns:
              # Identity
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              # Rule Reference
              - column:
                  name: rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rule_bindings_rule
                    references: validation_rules(id)
              - column:
                  name: rule_version_pinned
                  type: int
                  remarks: Pin to specific rule version (NULL = always use latest)

              # Target (What this binding applies to)
              - column:
                  name: target_type
                  type: varchar(50)
                  remarks: Target type (CAMPAIGN, DISCOUNT, VOUCHER, CASHBACK, etc.)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: varchar(100)
                  remarks: Target identifier
                  constraints:
                    nullable: false

              # Priority & State
              - column:
                  name: priority
                  type: int
                  remarks: Binding priority (higher = evaluated first)
                  defaultValueNumeric: 0
              - column:
                  name: active
                  type: boolean
                  remarks: Whether binding is active
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              # Time Constraints (Embedded)
              - column:
                  name: valid_from
                  type: timestamp
                  remarks: Start of validity period
              - column:
                  name: valid_to
                  type: timestamp
                  remarks: End of validity period
              - column:
                  name: timezone
                  type: varchar(50)
                  remarks: Timezone for time evaluations
                  defaultValue: Asia/Ho_Chi_Minh
              - column:
                  name: rrule
                  type: varchar(1000)
                  remarks: RFC 5545 recurrence rule (e.g., FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR)
              - column:
                  name: time_windows
                  type: text
                  remarks: 'JSON array of time windows: [{"start":"09:00","end":"17:00"}]'
              - column:
                  name: excluded_dates
                  type: text
                  remarks: 'JSON array of excluded dates: ["2024-01-01","2024-12-25"]'

              # Product Scope (Embedded)
              - column:
                  name: included_all
                  type: boolean
                  remarks: If true, applies to all products (check exclusions only)
                  defaultValueBoolean: false
              - column:
                  name: included_products
                  type: text
                  remarks: 'JSON array of included product IDs'
              - column:
                  name: excluded_products
                  type: text
                  remarks: 'JSON array of excluded product IDs'
              - column:
                  name: included_categories
                  type: text
                  remarks: 'JSON array of included category IDs'
              - column:
                  name: excluded_categories
                  type: text
                  remarks: 'JSON array of excluded category IDs'
              - column:
                  name: included_brands
                  type: text
                  remarks: 'JSON array of included brand IDs'
              - column:
                  name: excluded_brands
                  type: text
                  remarks: 'JSON array of excluded brand IDs'

              # Traffic Control (A/B Testing)
              - column:
                  name: traffic_percent
                  type: int
                  remarks: Percentage of traffic this binding applies to (0-100)
                  defaultValueNumeric: 100
              - column:
                  name: sticky_key_strategy
                  type: varchar(20)
                  remarks: Strategy for consistent traffic assignment (CUSTOMER_ID, ORDER_ID, DEVICE_ID)

              # Compiled DRL
              - column:
                  name: bundle_hash
                  type: varchar(255)
                  remarks: Compiled DRL bundle hash for this binding

              # Audit
              - column:
                  name: created_at
                  type: timestamp
                  remarks: Creation timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: Last update timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: Creator user ID
              - column:
                  name: updated_by
                  type: varchar(100)
                  remarks: Last updater user ID
              - column:
                  name: version
                  type: bigint
                  remarks: Optimistic locking version
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        # Indexes for common queries
        - createIndex:
            indexName: idx_rb_target
            tableName: rule_bindings
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_id

        - createIndex:
            indexName: idx_rb_rule
            tableName: rule_bindings
            columns:
              - column:
                  name: rule_id

        - createIndex:
            indexName: idx_rb_active_time
            tableName: rule_bindings
            columns:
              - column:
                  name: active
              - column:
                  name: valid_from
              - column:
                  name: valid_to

        - createIndex:
            indexName: idx_rb_target_active
            tableName: rule_bindings
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_id
              - column:
                  name: active

  # ============================================================================
  # OPERATORS REGISTRY
  # ============================================================================

  - changeSet:
      id: 001-create-operators-table
      author: harley hoang
      changes:
        - createTable:
            tableName: operators
            remarks: Operator registry with JSON schemas
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  remarks: Operator name
                  constraints:
                    nullable: false
              - column:
                  name: operator_version
                  type: int
                  remarks: Operator version
                  constraints:
                    nullable: false
              - column:
                  name: context
                  type: varchar(100)
                  remarks: Operator context (order, customer, time, etc.)
              - column:
                  name: json_schema
                  type: text
                  remarks: JSON Schema for operator parameters
              - column:
                  name: compiler_id
                  type: varchar(100)
                  remarks: Compiler template ID
              - column:
                  name: status
                  type: varchar(20)
                  remarks: Operator status (ACTIVE, DEPRECATED)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_operators_name_version
            tableName: operators
            unique: true
            columns:
              - column:
                  name: name
              - column:
                  name: operator_version

        - createIndex:
            indexName: idx_operators_context_status
            tableName: operators
            columns:
              - column:
                  name: context
              - column:
                  name: status

  # ============================================================================
  # OPERATOR REGISTRY (Alternative)
  # ============================================================================

  - changeSet:
      id: 001-create-operator-registry-table
      author: harley hoang
      changes:
        - createTable:
            tableName: operator_registry
            remarks: Registry of available operators with contexts
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: operator_id
                  type: varchar(100)
                  remarks: Operator unique identifier
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: context
                  type: varchar(100)
                  remarks: Operator context
              - column:
                  name: json_schema
                  type: text
                  remarks: JSON Schema for parameters
              - column:
                  name: compiler_id
                  type: varchar(100)
                  remarks: Compiler template ID
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_operator_registry_context
            tableName: operator_registry
            columns:
              - column:
                  name: context

  # ============================================================================
  # RESOURCES (External data sources)
  # ============================================================================

  - changeSet:
      id: 001-create-resources-table
      author: harley hoang
      changes:
        - createTable:
            tableName: resources
            remarks: External resources for selector options
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: label
                  type: varchar(255)
                  remarks: Resource label
              - column:
                  name: endpoint
                  type: varchar(500)
                  remarks: API endpoint URL
              - column:
                  name: method
                  type: varchar(20)
                  remarks: HTTP method
              - column:
                  name: auth_method
                  type: varchar(50)
                  remarks: Authentication method
              - column:
                  name: auth_config
                  type: varchar(500)
                  remarks: Auth configuration reference
              - column:
                  name: headers
                  type: text
                  remarks: HTTP headers as JSON
              - column:
                  name: field_key
                  type: varchar(100)
                  remarks: Key field name
              - column:
                  name: field_value
                  type: varchar(100)
                  remarks: Value field name
              - column:
                  name: timeout_seconds
                  type: int
                  remarks: Timeout in seconds
              - column:
                  name: retry_count
                  type: int
                  remarks: Retry count
              - column:
                  name: backoff_ms
                  type: int
                  remarks: Backoff milliseconds
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  # ============================================================================
  # OPERATOR RESOURCES
  # ============================================================================

  - changeSet:
      id: 001-create-operator-resources-table
      author: harley hoang
      changes:
        - createTable:
            tableName: operator_resources
            remarks: Link between operators and resources
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: operator_name
                  type: varchar(100)
                  remarks: Operator name
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: varchar(36)
                  remarks: Foreign key to resources
                  constraints:
                    nullable: false
                    foreignKeyName: fk_operator_resources_resource
                    references: resources(id)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_operator_resources_operator
            tableName: operator_resources
            columns:
              - column:
                  name: operator_name

  # ============================================================================
  # REASON CODES
  # ============================================================================

  - changeSet:
      id: 001-create-reason-codes-table
      author: harley hoang
      changes:
        - createTable:
            tableName: reason_codes
            remarks: Reason codes for validation failures
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(100)
                  remarks: Reason code
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: varchar(500)
                  remarks: Code description
              - column:
                  name: message_template
                  type: varchar(1000)
                  remarks: Message template
              - column:
                  name: category
                  type: varchar(50)
                  remarks: Category for grouping
              - column:
                  name: severity
                  type: varchar(20)
                  remarks: Severity level
              - column:
                  name: active
                  type: boolean
                  remarks: Whether code is active
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_reason_codes_category
            tableName: reason_codes
            columns:
              - column:
                  name: category

  # ============================================================================
  # PUBLISH JOBS
  # ============================================================================

  - changeSet:
      id: 001-create-publish-jobs-table
      author: harley hoang
      changes:
        - createTable:
            tableName: publish_jobs
            remarks: Asynchronous publish job tracking
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: validation_rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
                    foreignKeyName: fk_publish_jobs_rule
                    references: validation_rules(id)
              - column:
                  name: status
                  type: varchar(50)
                  remarks: Job status (PENDING, RUNNING, COMPLETED, FAILED)
                  constraints:
                    nullable: false
              - column:
                  name: initiated_by
                  type: varchar(100)
                  remarks: User who initiated publish
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text
                  remarks: Error message if failed
              - column:
                  name: started_at
                  type: timestamp
                  remarks: When job started
              - column:
                  name: completed_at
                  type: timestamp
                  remarks: When job completed
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_publish_jobs_status
            tableName: publish_jobs
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_publish_jobs_rule_id
            tableName: publish_jobs
            columns:
              - column:
                  name: validation_rule_id

  # ============================================================================
  # RULE VERSIONS (History)
  # ============================================================================

  - changeSet:
      id: 001-create-rule-versions-table
      author: harley hoang
      changes:
        - createTable:
            tableName: rule_versions
            remarks: Historical versions of rules
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: validation_rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rule_versions_rule
                    references: validation_rules(id)
              - column:
                  name: version_number
                  type: bigint
                  remarks: Version number
                  constraints:
                    nullable: false
              - column:
                  name: snapshot
                  type: text
                  remarks: Complete rule snapshot as JSON
                  constraints:
                    nullable: false
              - column:
                  name: change_summary
                  type: varchar(1000)
                  remarks: Summary of changes
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: Who created this version
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_rule_versions_rule_version
            tableName: rule_versions
            unique: true
            columns:
              - column:
                  name: validation_rule_id
              - column:
                  name: version_number
                  descending: true

  # ============================================================================
  # RULE CONFIGURATION (Element Collection)
  # ============================================================================

  - changeSet:
      id: 001-create-rule-configuration-table
      author: harley hoang
      changes:
        - createTable:
            tableName: rule_configuration
            remarks: Configuration key-value pairs for rules
            columns:
              - column:
                  name: rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
              - column:
                  name: config_key
                  type: varchar(255)
                  remarks: Configuration key
                  constraints:
                    nullable: false
              - column:
                  name: config_value
                  type: text
                  remarks: Configuration value

        - addPrimaryKey:
            tableName: rule_configuration
            columnNames: rule_id, config_key
            constraintName: pk_rule_configuration

  # ============================================================================
  # RULE TARGET SEGMENTS (Element Collection)
  # ============================================================================

  - changeSet:
      id: 001-create-rule-target-segments-table
      author: harley hoang
      changes:
        - createTable:
            tableName: rule_target_segments
            remarks: Target segments for rules
            columns:
              - column:
                  name: rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
              - column:
                  name: segment
                  type: varchar(255)
                  remarks: Segment identifier
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: rule_target_segments
            columnNames: rule_id, segment
            constraintName: pk_rule_target_segments
