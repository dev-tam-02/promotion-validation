databaseChangeLog:
  - changeSet:
      id: 018-create-assignment-snapshots
      author: harley.hoang
      comment: Create table for storing assignment snapshots for saga compensation
      changes:
        - createTable:
            tableName: assignment_snapshots
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: assignment_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: snapshot_version
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Incremental version for this assignment's snapshots
              - column:
                  name: snapshot_data
                  type: longtext
                  constraints:
                    nullable: false
                  remarks: JSON containing assignment + applicability rules + temporal links
              - column:
                  name: saga_id
                  type: varchar(100)
                  remarks: Saga ID that triggered the snapshot
              - column:
                  name: correlation_id
                  type: varchar(100)
                  remarks: Correlation ID for tracing
              - column:
                  name: snapshot_reason
                  type: varchar(50)
                  constraints:
                    nullable: false
                  remarks: Reason for snapshot - BEFORE_UPDATE, BEFORE_DELETE
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(50)
              - column:
                  name: expires_at
                  type: timestamp
                  remarks: Optional expiration time for auto-cleanup

        - createIndex:
            tableName: assignment_snapshots
            indexName: idx_assignment_snapshot_version
            columns:
              - column:
                  name: assignment_id
              - column:
                  name: snapshot_version
            unique: true

        - createIndex:
            tableName: assignment_snapshots
            indexName: idx_assignment_snapshot_saga_id
            columns:
              - column:
                  name: saga_id

        - createIndex:
            tableName: assignment_snapshots
            indexName: idx_assignment_snapshot_created_at
            columns:
              - column:
                  name: created_at
