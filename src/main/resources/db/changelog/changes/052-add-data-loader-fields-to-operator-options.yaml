databaseChangeLog:
  # Add data-loader configuration columns to operator_options.
  # Replaces ad-hoc dataSourceType + dataSourceEndpoint with a typed loader
  # contract so each rule declares HOW its options are sourced.
  #
  # data_loader_type values used by FE/BE:
  #   pp-segment, pp-product, pp-customer, pp-metadata,
  #   number-input, type-to-enter, boolean
  #
  # data_loader_config (JSON, nullable) carries loader-specific knobs, e.g.:
  #   {"multi": true, "grouped": true, "groupBy": "type"}                  pp-product
  #   {"schemaType": "STANDARD", "schemaName": "customer"}                 pp-metadata
  #
  # applies_to_metadata_schema (nullable) — short alias used by metadata
  # categories. Mirrors data_loader_config.schemaName but is denormalized for
  # cheap runtime expansion in RuleBuilderService.getAllCategories.
  - changeSet:
      id: 052-add-data-loader-fields-to-operator-options
      author: pp-validation
      comment: Add data_loader_type, data_loader_config, applies_to_metadata_schema to operator_options
      changes:
        - addColumn:
            tableName: operator_options
            columns:
              - column:
                  name: data_loader_type
                  type: varchar(50)
                  remarks: "Loader contract: pp-segment | pp-product | pp-customer | pp-metadata | number-input | type-to-enter | boolean"
              - column:
                  name: data_loader_config
                  type: text
                  remarks: JSON object with loader-specific configuration
              - column:
                  name: applies_to_metadata_schema
                  type: varchar(50)
                  remarks: For metadata categories — pp-metadata schema name (customer/order/redemption)

      rollback:
        - dropColumn:
            tableName: operator_options
            columnName: data_loader_type
        - dropColumn:
            tableName: operator_options
            columnName: data_loader_config
        - dropColumn:
            tableName: operator_options
            columnName: applies_to_metadata_schema
