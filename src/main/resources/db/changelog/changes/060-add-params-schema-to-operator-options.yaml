databaseChangeLog:
  # Add params_schema (JSON Schema) per operator_options row so the RuleService
  # can validate the COND node's params payload against the operator's expected
  # shape (key names + value types + bounds) before persisting and publishing.
  - changeSet:
      id: 060-add-params-schema-column
      author: pp-validation
      comment: "Add params_schema column to operator_options"
      changes:
        - addColumn:
            tableName: operator_options
            columns:
              - column:
                  name: params_schema
                  type: TEXT
                  remarks: "JSON Schema (draft-07) describing the shape of a COND node's params for this operator."

  - changeSet:
      id: 060-seed-params-schema-numeric
      author: pp-validation
      comment: "Seed params_schema for 6 numeric operator_options"
      changes:
        - update:
            tableName: operator_options
            columns:
              - column:
                  name: params_schema
                  value: '{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","required":["amount"],"properties":{"amount":{"type":"number","minimum":0},"currency":{"type":"string","minLength":1}},"additionalProperties":true}'
            where: "id IN ('opt-total-amount-before-discounts','opt-total-amount-after-discounts','opt-initial-amount')"

        - update:
            tableName: operator_options
            columns:
              - column:
                  name: params_schema
                  value: '{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","required":["count"],"properties":{"count":{"type":"integer","minimum":0}},"additionalProperties":true}'
            where: "id='opt-items-quantity'"

        - update:
            tableName: operator_options
            columns:
              - column:
                  name: params_schema
                  value: '{"$schema":"http://json-schema.org/draft-07/schema#","type":"object","anyOf":[{"required":["minPrice"],"properties":{"minPrice":{"type":"number","minimum":0}}},{"required":["maxPrice"],"properties":{"maxPrice":{"type":"number","minimum":0}}},{"required":["price"],"properties":{"price":{"type":"number","minimum":0}}}],"additionalProperties":true}'
            where: "id IN ('opt-price-of-each-item','opt-price-of-any-item')"

      rollback:
        - update:
            tableName: operator_options
            columns:
              - column: { name: params_schema, value: null }
            where: "id IN ('opt-total-amount-before-discounts','opt-total-amount-after-discounts','opt-initial-amount','opt-items-quantity','opt-price-of-each-item','opt-price-of-any-item')"

      # Note: rollback for addColumn step is auto-generated by Liquibase (DROP COLUMN)
