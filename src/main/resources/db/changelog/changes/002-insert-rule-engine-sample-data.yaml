              - column:
                  name: priority
                  valueNumeric: 0
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: valid_from
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: valid_to
                  valueDate: 2025-12-31T23:59:59
              - column:
                  name: timezone
                  value: Asia/Ho_Chi_Minh
              - column:
