databaseChangeLog:
  # Sample operators
  - changeSet:
      id: 002-insert-sample-operators
      author: harley hoang
      changes:
        - insert:
            tableName: operators
            columns:
              - column:
                  name: id
                  value: 01932b6f-0001-7000-8000-000000000001
              - column:
                  name: name
                  value: order.total.gte
              - column:
                  name: operator_version
                  valueNumeric: 1
              - column:
                  name: context
                  value: order
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"amount":{"type":"number"},"currency":{"type":"string"}},"required":["amount"]}'
              - column:
                  name: compiler_id
                  value: tpl_order_total_gte_v1
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00

        - insert:
            tableName: operators
            columns:
              - column:
                  name: id
                  value: 01932b6f-0001-7000-8000-000000000002
              - column:
                  name: name
                  value: customer.in_segment
              - column:
                  name: operator_version
                  valueNumeric: 1
              - column:
                  name: context
                  value: customer
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"segments":{"type":"array","items":{"type":"string"}}},"required":["segments"]}'
              - column:
                  name: compiler_id
                  value: tpl_customer_segment_v1
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00

        - insert:
            tableName: operators
            columns:
              - column:
                  name: id
                  value: 01932b6f-0001-7000-8000-000000000003
              - column:
                  name: name
                  value: time.window.active
              - column:
                  name: operator_version
                  valueNumeric: 1
              - column:
                  name: context
                  value: time
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"startTime":{"type":"string","pattern":"^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"},"endTime":{"type":"string","pattern":"^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"},"timezone":{"type":"string"},"daysOfWeek":{"type":"array","items":{"type":"string","enum":["MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY","SUNDAY"]}},"spansMidnight":{"type":"boolean"}},"required":["startTime","endTime"]}'
              - column:
                  name: compiler_id
                  value: tpl_time_window_v1
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00

  # Sample reason codes
  - changeSet:
      id: 002-insert-sample-reason-codes
      author: harley hoang
      changes:
        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000001
              - column:
                  name: code
                  value: ORDER_TOTAL_MIN
              - column:
                  name: description
                  value: Order total does not meet minimum requirement
              - column:
                  name: message_template
                  value: Order total must be at least {amount} {currency}
              - column:
                  name: category
                  value: ORDER_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000002
              - column:
                  name: code
                  value: AUDIENCE_SEGMENT
              - column:
                  name: description
                  value: Customer not in target segment
              - column:
                  name: message_template
                  value: This promotion is only available for {segments} customers
              - column:
                  name: category
                  value: CUSTOMER_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000003
              - column:
                  name: code
                  value: TIME_WINDOW
              - column:
                  name: description
                  value: Outside valid time window
              - column:
                  name: message_template
                  value: Promotion is not active at this time
              - column:
                  name: category
                  value: TIME_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000004
              - column:
                  name: code
                  value: META_MATCH
              - column:
                  name: description
                  value: Metadata does not match required criteria
              - column:
                  name: message_template
                  value: "{field} must be {value}"
              - column:
                  name: category
                  value: METADATA_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

  # Sample validation rules
  - changeSet:
      id: 002-insert-sample-validation-rules
      author: harley hoang
      changes:
        - insert:
            tableName: validation_rules
            columns:
              - column:
                  name: id
                  value: 01932b6f-0005-7000-8000-000000000001
              - column:
                  name: code
                  value: WEEKEND_VIP_500K
              - column:
                  name: name
                  value: Weekend VIP ≥500k, HCM express
              - column:
                  name: state
                  value: DRAFT
              - column:
                  name: rule_version
                  valueNumeric: 1
              - column:
                  name: logic
                  value: ALL
              - column:
                  name: dsl
                  value: '{}'
              - column:
                  name: created_by
                  value: admin
              - column:
                  name: updated_by
                  value: admin

        - insert:
            tableName: validation_rules
            columns:
              - column:
                  name: id
                  value: 01932b6f-0005-7000-8000-000000000002
              - column:
                  name: code
                  value: BUSINESS_HOURS_PROMO
              - column:
                  name: name
                  value: Business Hours Promotion
              - column:
                  name: state
                  value: DRAFT
              - column:
                  name: rule_version
                  valueNumeric: 1
              - column:
                  name: logic
                  value: ALL
              - column:
                  name: dsl
                  value: '{}'
              - column:
                  name: created_by
                  value: admin
              - column:
                  name: updated_by
                  value: admin

  # Sample rule nodes for first rule (WEEKEND_VIP_500K)
  - changeSet:
      id: 002-insert-sample-rule-nodes
      author: harley hoang
      changes:
        - insert:
            tableName: rule_nodes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0006-7000-8000-000000000001
              - column:
                  name: node_id
                  value: n1
              - column:
                  name: type
                  value: GROUP
              - column:
                  name: group_logic
                  value: ALL
              - column:
                  name: children_ids
                  value: '["n3","n4"]'
              - column:
                  name: node_order
                  valueNumeric: 0
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000001

        - insert:
            tableName: rule_nodes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0006-7000-8000-000000000003
              - column:
                  name: node_id
                  value: n3
              - column:
                  name: type
                  value: COND
              - column:
                  name: operator_name
                  value: order.total.gte
              - column:
                  name: params
                  value: '{"amount":500000,"currency":"VND"}'
              - column:
                  name: reason_code
                  value: ORDER_TOTAL_MIN
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000001
              - column:
                  name: parent_id
                  value: 01932b6f-0006-7000-8000-000000000001

        - insert:
            tableName: rule_nodes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0006-7000-8000-000000000004
              - column:
                  name: node_id
                  value: n4
              - column:
                  name: type
                  value: COND
              - column:
                  name: operator_name
                  value: customer.in_segment
              - column:
                  name: params
                  value: '{"segments":["VIP"]}'
              - column:
                  name: reason_code
                  value: AUDIENCE_SEGMENT
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000001
              - column:
                  name: parent_id
                  value: 01932b6f-0006-7000-8000-000000000001

  # Sample rule nodes for second rule (BUSINESS_HOURS_PROMO)
  - changeSet:
      id: 002-insert-sample-rule-nodes-second-rule
      author: harley hoang
      changes:
        - insert:
            tableName: rule_nodes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0006-7000-8000-000000000005
              - column:
                  name: node_id
                  value: n1
              - column:
                  name: type
                  value: GROUP
              - column:
                  name: group_logic
                  value: ALL
              - column:
                  name: children_ids
                  value: '["n2","n3"]'
              - column:
                  name: node_order
                  valueNumeric: 0
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000002

        - insert:
            tableName: rule_nodes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0006-7000-8000-000000000006
              - column:
                  name: node_id
                  value: n2
              - column:
                  name: type
                  value: COND
              - column:
                  name: operator_name
                  value: time.window.active
              - column:
                  name: params
                  value: '{"startTime":"09:00:00","endTime":"17:00:00","timezone":"Asia/Bangkok","daysOfWeek":["MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY"],"spansMidnight":false}'
              - column:
                  name: reason_code
                  value: TIME_WINDOW
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000002
              - column:
                  name: parent_id
                  value: 01932b6f-0006-7000-8000-000000000005

        - insert:
            tableName: rule_nodes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0006-7000-8000-000000000007
              - column:
                  name: node_id
                  value: n3
              - column:
                  name: type
                  value: COND
              - column:
                  name: operator_name
                  value: order.total.gte
              - column:
                  name: params
                  value: '{"amount":300000,"currency":"VND"}'
              - column:
                  name: reason_code
                  value: ORDER_TOTAL_MIN
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000002
              - column:
                  name: parent_id
                  value: 01932b6f-0006-7000-8000-000000000005

  # Sample rule usage limits
  - changeSet:
      id: 002-insert-sample-usage-limits
      author: harley hoang
      changes:
        - insert:
            tableName: rule_usage_limits
            columns:
              - column:
                  name: id
                  value: 01932b6f-0007-7000-8000-000000000001
              - column:
                  name: validation_rule_id
                  value: 01932b6f-0005-7000-8000-000000000001
              - column:
                  name: per_code_total
                  valueNumeric: 1000
              - column:
                  name: per_customer
                  valueNumeric: 3
              - column:
                  name: per_day
                  valueNumeric: 200

  # Sample rule bindings (replaces old rule_assignments)
  - changeSet:
      id: 002-insert-sample-rule-bindings
      author: harley hoang
      changes:
        - insert:
            tableName: rule_bindings
            columns:
              - column:
                  name: id
                  value: 01932b6f-0009-7000-8000-000000000001
              - column:
                  name: rule_id
                  value: 01932b6f-0005-7000-8000-000000000001
              - column:
                  name: target_type
                  value: VOUCHER
              - column:
                  name: target_id
