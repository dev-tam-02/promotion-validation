                  name: tenant_id
                  value: default
              - column:
                  name: name
                  value: Weekend Mornings
              - column:
                  name: tz
                  value: Asia/Bangkok
              - column:
                  name: rrule
                  value: FREQ=WEEKLY;BYDAY=SA,SU;BYHOUR=9,10,11;BYMINUTE=0;BYSECOND=0
              - column:
                  name: rdate
                  value: '[]'
              - column:
                  name: exdate
                  value: '["2025-10-20T09:00:00+07:00"]'
              - column:
                  name: metadata
                  value: '{}'

        - insert:
            tableName: temporal_policies
            columns:
              - column:
                  name: id
                  value: 01932b6f-0002-7000-8000-000000000002
              - column:
                  name: tenant_id
                  value: default
              - column:
                  name: name
                  value: Business Hours
              - column:
                  name: tz
                  value: Asia/Bangkok
              - column:
                  name: rrule
                  value: FREQ=DAILY;BYHOUR=9,10,11,12,13,14,15,16,17;BYMINUTE=0;BYSECOND=0
              - column:
                  name: rdate
                  value: '[]'
              - column:
                  name: exdate
                  value: '[]'
              - column:
                  name: metadata
                  value: '{}'

