  # Sample resources
  - changeSet:
      id: 002-insert-sample-resources
      author: harley hoang
      changes:
        - insert:
            tableName: resources
            columns:
              - column:
                  name: id
                  value: 01932b6f-000a-7000-8000-000000000001
              - column:
                  name: label
                  value: CDP Segments
              - column:
                  name: endpoint
                  value: https://cdp.example.com/api/segments
              - column:
                  name: method
                  value: GET
              - column:
                  name: auth_method
                  value: bearer
              - column:
                  name: auth_config
                  value: secret/cdp-token
              - column:
                  name: headers
                  value: '{"Accept":"application/json"}'
              - column:
                  name: field_key
                  value: id
              - column:
                  name: field_value
                  value: name
              - column:
                  name: timeout_seconds
                  valueNumeric: 5
              - column:
                  name: retry_count
                  valueNumeric: 2
              - column:
                  name: backoff_ms
                  valueNumeric: 200

  # Sample operator registry
  - changeSet:
