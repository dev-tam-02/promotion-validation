                  value: Order total must be at least {amount} {currency}
              - column:
                  name: category
                  value: ORDER_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000002
              - column:
                  name: code
                  value: AUDIENCE_SEGMENT
              - column:
