              - column:
                  name: operator_id
                  value: order.total.gte
              - column:
                  name: context
                  value: order
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"amount":{"type":"number"},"currency":{"type":"string"}},"required":["amount"]}'
              - column:
                  name: compiler_id
                  value: tpl_order_total_gte_v1

        - insert:
            tableName: operator_registry
            columns:
              - column:
                  name: id
                  value: 01932b6f-000b-7000-8000-000000000002
              - column:
                  name: operator_id
                  value: customer.in_segment
              - column:
                  name: context
