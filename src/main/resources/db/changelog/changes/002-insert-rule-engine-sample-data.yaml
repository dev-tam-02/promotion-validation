databaseChangeLog:
  # Sample operators
  - changeSet:
      id: 002-insert-sample-operators
      author: harley hoang
      changes:
        - insert:
            tableName: operators
            columns:
              - column:
                  name: id
                  value: 01932b6f-0001-7000-8000-000000000001
              - column:
                  name: tenant_id
                  value: default
              - column:
                  name: name
                  value: order.total.gte
              - column:
                  name: operator_version
                  valueNumeric: 1
              - column:
                  name: context
                  value: order
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"amount":{"type":"number"},"currency":{"type":"string"}},"required":["amount"]}'
              - column:
                  name: compiler_id
                  value: tpl_order_total_gte_v1
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00

        - insert:
            tableName: operators
            columns:
              - column:
                  name: id
                  value: 01932b6f-0001-7000-8000-000000000002
              - column:
                  name: tenant_id
                  value: default
              - column:
                  name: name
                  value: customer.in_segment
              - column:
                  name: operator_version
                  valueNumeric: 1
              - column:
                  name: context
                  value: customer
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"segments":{"type":"array","items":{"type":"string"}}},"required":["segments"]}'
              - column:
                  name: compiler_id
                  value: tpl_customer_segment_v1
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00

        - insert:
            tableName: operators
            columns:
              - column:
                  name: id
                  value: 01932b6f-0001-7000-8000-000000000003
              - column:
                  name: tenant_id
                  value: default
              - column:
                  name: name
                  value: time.window.active
              - column:
                  name: operator_version
                  valueNumeric: 1
              - column:
                  name: context
                  value: time
              - column:
                  name: json_schema
                  value: '{"type":"object","properties":{"policyId":{"type":"string"},"tz":{"type":"string"}},"required":["policyId"]}'
              - column:
                  name: compiler_id
                  value: tpl_time_window_v1
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00

  # Sample temporal policies
