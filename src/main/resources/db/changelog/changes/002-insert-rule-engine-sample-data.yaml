              - column:
                  name: created_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: updated_at
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: created_by
                  value: admin
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: rule_bindings
            columns:
              - column:
                  name: id
                  value: 01932b6f-0009-7000-8000-000000000002
              - column:
                  name: rule_id
                  value: 01932b6f-0005-7000-8000-000000000002
              - column:
                  name: target_type
                  value: CAMPAIGN
              - column:
                  name: target_id
                  value: BUSINESS_HOURS_CAMPAIGN
              - column:
                  name: priority
                  valueNumeric: 0
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: valid_from
                  valueDate: 2025-01-01T00:00:00
              - column:
                  name: valid_to
