                  value: Customer not in target segment
              - column:
                  name: message_template
                  value: This promotion is only available for {segments} customers
              - column:
                  name: category
                  value: CUSTOMER_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000003
              - column:
                  name: code
                  value: TIME_WINDOW
              - column:
                  name: description
                  value: Outside valid time window
              - column:
                  name: message_template
                  value: Promotion is not active at this time
              - column:
                  name: category
                  value: TIME_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

        - insert:
            tableName: reason_codes
            columns:
              - column:
                  name: id
                  value: 01932b6f-0004-7000-8000-000000000004
              - column:
                  name: code
                  value: META_MATCH
              - column:
                  name: description
                  value: Metadata does not match required criteria
              - column:
                  name: message_template
                  value: {field} must be {value}
              - column:
                  name: category
                  value: METADATA_VALIDATION
              - column:
                  name: severity
                  value: ERROR
              - column:
                  name: active
                  valueBoolean: true

