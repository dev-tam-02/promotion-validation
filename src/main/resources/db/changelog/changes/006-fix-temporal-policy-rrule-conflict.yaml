databaseChangeLog:
  # Fix temporal policy RRULE conflicts - remove BYHOUR when time windows exist
  - changeSet:
      id: 006-fix-temporal-policy-rrule-weekend-mornings
      author: harley hoang
      comment: Remove BYHOUR from RRULE when time_windows are used (separation of concerns)
      changes:
        - update:
            tableName: temporal_policies
            columns:
              - column:
                  name: rrule
                  value: FREQ=WEEKLY;BYDAY=SA,SU
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP
            where: id = '01932b6f-0002-7000-8000-000000000001'

  - changeSet:
      id: 006-fix-temporal-policy-rrule-business-hours
      author: harley hoang
      comment: Remove BYHOUR from RRULE and add proper time_window for Business Hours policy
      changes:
        - update:
            tableName: temporal_policies
            columns:
              - column:
                  name: rrule
                  value: FREQ=DAILY
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP
            where: id = '01932b6f-0002-7000-8000-000000000002'

  - changeSet:
      id: 006-fix-weekend-policy-window-end-time
      author: harley hoang
      comment: Fix Weekend Mornings end_time from 12:00 to correct value
      changes:
        - update:
            tableName: temporal_policy_windows
            columns:
              - column:
                  name: end_time
                  value: '12:00:00'
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP
            where: id = '01932b6f-0003-7000-8000-000000000001'

  - changeSet:
      id: 006-add-validation-design-doc-comment
      author: harley hoang
      comment: |
        DESIGN DECISION: RRULE vs Time Windows

        RRULE Purpose:
        - Select RECURRENCE DATES (which days/months)
        - Use: FREQ, BYDAY, BYMONTH, BYMONTHDAY, COUNT, UNTIL
        - Example: FREQ=WEEKLY;BYDAY=SA,SU (every Saturday and Sunday)

        Time Windows Purpose:
        - Select TIME RANGES within selected dates
        - Use: start_time, end_time
        - Example: 09:00 - 17:00 (9 AM to 5 PM)
        - Automatically handles spans midnight (18:00 - 06:00)

        RULE: DO NOT use BYHOUR/BYMINUTE/BYSECOND when time_windows exist!

        Why not use BYHOUR alone?
        1. RRULE generates discrete timestamps (9:00, 10:00, 11:00) - not continuous ranges
        2. Cannot express "every minute" efficiently (must list 0-59)
        3. Spans midnight requires 2 separate RRULEs
        4. Performance: O(n) occurrence check vs O(1) range check
        5. UX: Business users understand "9 AM - 5 PM" better than BYHOUR list

        Correct Usage:
        ✅ RRULE: FREQ=WEEKLY;BYDAY=SA,SU + TIME_WINDOW: 09:00-17:00
        ❌ RRULE: FREQ=WEEKLY;BYDAY=SA,SU;BYHOUR=9,10,11,12,13,14,15,16,17
      changes:
        - tagDatabase:
            tag: temporal-policy-design-v1
