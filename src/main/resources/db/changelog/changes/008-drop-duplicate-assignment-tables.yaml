databaseChangeLog:
  - changeSet:
      id: 008-drop-rule-assignment-subjects-table
      author: harley hoang
      comment: Drop rule_assignment_subjects table - not used in application, duplicates functionality of assignments table
      changes:
        - dropTable:
            tableName: rule_assignment_subjects
            cascadeConstraints: true

  - changeSet:
      id: 008-drop-rule-assignments-table
      author: harley hoang
      comment: Drop rule_assignments table - not used in application, duplicates functionality of assignments table
      changes:
        - dropTable:
            tableName: rule_assignments
            cascadeConstraints: true
