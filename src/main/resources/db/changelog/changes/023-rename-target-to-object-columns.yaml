databaseChangeLog:
  # ============================================================================
  # RENAME target_type/target_id TO object_type/object_id
  # Unify terminology with command schema
  # ============================================================================

  - changeSet:
      id: 023-rename-target-to-object-columns
      author: harley hoang
      comment: Rename target_type and target_id columns to object_type and object_id for terminology consistency
      changes:
        # Rename columns
        - renameColumn:
            tableName: rule_bindings
            oldColumnName: target_type
            newColumnName: object_type
            columnDataType: varchar(50)

        - renameColumn:
            tableName: rule_bindings
            oldColumnName: target_id
            newColumnName: object_id
            columnDataType: varchar(100)

        # Drop old indexes
        - dropIndex:
            tableName: rule_bindings
            indexName: idx_rb_target

        - dropIndex:
            tableName: rule_bindings
            indexName: idx_rb_target_active

        # Create new indexes with new names
        - createIndex:
            tableName: rule_bindings
            indexName: idx_rb_object
            columns:
              - column:
                  name: object_type
              - column:
                  name: object_id

        - createIndex:
            tableName: rule_bindings
            indexName: idx_rb_object_active
            columns:
              - column:
                  name: object_type
              - column:
                  name: object_id
              - column:
                  name: active
