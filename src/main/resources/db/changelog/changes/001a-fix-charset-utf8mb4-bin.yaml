databaseChangeLog:
  # ============================================================================
  # Charset fix: convert DB default + existing tables to utf8mb4 / utf8mb4_bin.
  #
  # Some envs had the schema created with latin1 default → seed inserts that
  # contain Vietnamese diacritics or symbols (≥, ∈, em-dash) fail with
  # "Incorrect string value" when Liquibase runs 002 / 022 / 028 / ...
  #
  # This file runs right after 001 (in master changelog), so:
  #   - fresh DB: 001 creates tables with old default; 001a converts them and
  #     sets the DB default to utf8mb4_bin → all later createTable inherits it.
  #   - existing DB: 001a converts whatever tables already exist (others are
  #     skipped via tableExists preCondition).
  # ============================================================================

  - changeSet:
      id: 001a-alter-database-charset
      author: harley hoang
      comment: Set database default to utf8mb4 / utf8mb4_bin for future tables
      changes:
        - sql:
            dbms: mariadb
            sql: "ALTER DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"

  - changeSet:
      id: 001a-convert-validation-rules
      author: harley hoang
      preConditions:
        - onFail: MARK_RAN
        - tableExists: { tableName: validation_rules }
      changes:
        - sql: { dbms: mariadb,mysql, sql: "ALTER TABLE validation_rules CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_bin" }

  - changeSet:
