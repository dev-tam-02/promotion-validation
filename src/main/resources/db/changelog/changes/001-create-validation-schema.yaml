databaseChangeLog:
  - changeSet:
      id: 001-create-validation-rules-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_rules
            remarks: Stores dynamic validation rules that can be applied to various data types
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key using UUIDv7
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_code
                  type: varchar(100)
                  remarks: Unique code identifying the rule
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: rule_name
                  type: varchar(255)
                  remarks: Human-readable name of the rule
                  constraints:
                    nullable: false
              - column:
                  name: rule_type
                  type: varchar(50)
                  remarks: Type of validation (PATTERN, RANGE, LENGTH, FORMAT, BUSINESS, CUSTOM)
                  constraints:
                    nullable: false
              - column:
                  name: target_entity
                  type: varchar(100)
                  remarks: Entity type this rule applies to (e.g., Customer, Order, Product)
                  constraints:
                    nullable: false
              - column:
                  name: target_field
                  type: varchar(100)
                  remarks: Field name this rule applies to
                  constraints:
                    nullable: false
              - column:
                  name: validation_expression
                  type: text
                  remarks: Validation expression or pattern (regex, range, etc.)
                  constraints:
                    nullable: false
              - column:
                  name: error_code
                  type: varchar(50)
                  remarks: Error code to return when validation fails
                  constraints:
                    nullable: false
              - column:
                  name: error_message_template
                  type: varchar(500)
                  remarks: Error message template with placeholders
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: varchar(20)
                  remarks: Severity level (ERROR, WARNING, INFO)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  remarks: Whether the rule is currently active
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: int
                  remarks: Execution priority (lower number = higher priority)
                  defaultValueNumeric: 100
                  constraints:
                    nullable: false
              - column:
                  name: metadata
                  type: json
                  remarks: Additional metadata in JSON format
              - column:
                  name: created_at
                  type: timestamp
                  remarks: Creation timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: Last update timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: User who created the rule
              - column:
                  name: updated_by
                  type: varchar(100)
                  remarks: User who last updated the rule

        - createIndex:
            indexName: idx_validation_rules_entity_field
            tableName: validation_rules
            columns:
              - column:
                  name: target_entity
              - column:
                  name: target_field
              - column:
                  name: is_active

        - createIndex:
            indexName: idx_validation_rules_type
            tableName: validation_rules
            columns:
              - column:
                  name: rule_type

        - createIndex:
            indexName: idx_validation_rules_active_priority
            tableName: validation_rules
            columns:
              - column:
                  name: is_active
              - column:
                  name: priority

  - changeSet:
      id: 001-create-validation-schemas-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_schemas
            remarks: Stores Avro and JSON schemas for validation
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key using UUIDv7
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: schema_name
                  type: varchar(255)
                  remarks: Name of the schema
                  constraints:
                    nullable: false
              - column:
                  name: schema_namespace
                  type: varchar(255)
                  remarks: Namespace of the schema
                  constraints:
                    nullable: false
              - column:
                  name: schema_version
                  type: varchar(20)
                  remarks: Version of the schema
                  constraints:
                    nullable: false
              - column:
                  name: schema_type
                  type: varchar(20)
                  remarks: Type of schema (AVRO, JSON, XML)
                  constraints:
                    nullable: false
              - column:
                  name: schema_content
                  type: text
                  remarks: The actual schema definition
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  remarks: Description of the schema
              - column:
                  name: is_active
                  type: boolean
                  remarks: Whether the schema is currently active
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: compatibility_mode
                  type: varchar(50)
                  remarks: Schema compatibility mode (BACKWARD, FORWARD, FULL, NONE)
                  defaultValue: BACKWARD
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  remarks: Creation timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: Last update timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: User who created the schema

        - addUniqueConstraint:
            tableName: validation_schemas
            columnNames: schema_namespace, schema_name, schema_version
            constraintName: uk_schema_namespace_name_version

        - createIndex:
            indexName: idx_validation_schemas_type
            tableName: validation_schemas
            columns:
              - column:
                  name: schema_type

        - createIndex:
            indexName: idx_validation_schemas_active
            tableName: validation_schemas
            columns:
              - column:
                  name: is_active

  - changeSet:
      id: 001-create-validation-results-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_results
            remarks: Audit log of validation results
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key using UUIDv7
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(100)
                  remarks: Type of entity validated
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: varchar(100)
                  remarks: ID of the entity validated
                  constraints:
                    nullable: false
              - column:
                  name: validation_timestamp
                  type: timestamp
                  remarks: When validation was performed
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_valid
                  type: boolean
                  remarks: Overall validation result
                  constraints:
                    nullable: false
              - column:
                  name: error_count
                  type: int
                  remarks: Number of validation errors
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: warning_count
                  type: int
                  remarks: Number of validation warnings
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: validation_errors
                  type: json
                  remarks: Detailed validation errors in JSON format
              - column:
                  name: validated_data_snapshot
                  type: json
                  remarks: Snapshot of validated data for audit
              - column:
                  name: execution_time_ms
                  type: bigint
                  remarks: Validation execution time in milliseconds
              - column:
                  name: validation_context
                  type: json
                  remarks: Additional context information
              - column:
                  name: created_by
                  type: varchar(100)
                  remarks: User or system that triggered validation

        - createIndex:
            indexName: idx_validation_results_entity
            tableName: validation_results
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id

        - createIndex:
            indexName: idx_validation_results_timestamp
            tableName: validation_results
            columns:
              - column:
                  name: validation_timestamp
                  descending: true

        - createIndex:
            indexName: idx_validation_results_valid
            tableName: validation_results
            columns:
              - column:
                  name: is_valid

  - changeSet:
      id: 001-create-validation-rule-conditions-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_rule_conditions
            remarks: Conditions that must be met for a rule to apply
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key using UUIDv7
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_id
                  type: varchar(36)
                  remarks: Foreign key to validation_rules
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rule_condition_rule
                    references: validation_rules(id)
                    deleteCascade: true
              - column:
                  name: condition_type
                  type: varchar(50)
                  remarks: Type of condition (FIELD_VALUE, FIELD_EXISTS, CUSTOM_EXPRESSION)
                  constraints:
                    nullable: false
              - column:
                  name: field_name
                  type: varchar(100)
                  remarks: Field to check in condition
              - column:
                  name: operator
                  type: varchar(20)
                  remarks: Comparison operator (EQUALS, NOT_EQUALS, GREATER_THAN, etc.)
                  constraints:
                    nullable: false
              - column:
                  name: expected_value
                  type: varchar(500)
                  remarks: Expected value for comparison
              - column:
                  name: condition_expression
                  type: text
                  remarks: Complex condition expression
              - column:
                  name: logical_operator
                  type: varchar(10)
                  remarks: Logical operator to combine with other conditions (AND, OR)
                  defaultValue: AND
              - column:
                  name: condition_order
                  type: int
                  remarks: Order of condition evaluation
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  remarks: Whether the condition is active
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  remarks: Creation timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_rule_conditions_rule_id
            tableName: validation_rule_conditions
            columns:
              - column:
                  name: rule_id

        - createIndex:
            indexName: idx_rule_conditions_active
            tableName: validation_rule_conditions
            columns:
              - column:
                  name: is_active

  - changeSet:
      id: 001-create-validation-error-messages-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_error_messages
            remarks: Customizable error messages for validation failures
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key using UUIDv7
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: error_code
                  type: varchar(50)
                  remarks: Unique error code
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: language_code
                  type: varchar(10)
                  remarks: Language code (en, vi, etc.)
                  defaultValue: en
                  constraints:
                    nullable: false
              - column:
                  name: message_template
                  type: varchar(1000)
                  remarks: Error message template with placeholders
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  remarks: Description of the error
              - column:
                  name: suggested_action
                  type: varchar(500)
                  remarks: Suggested action to fix the error
              - column:
                  name: severity
                  type: varchar(20)
                  remarks: Error severity (ERROR, WARNING, INFO)
                  defaultValue: ERROR
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(50)
                  remarks: Error category for grouping
              - column:
                  name: is_active
                  type: boolean
                  remarks: Whether the message is active
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  remarks: Creation timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  remarks: Last update timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_error_messages_code_lang
            tableName: validation_error_messages
            columns:
              - column:
                  name: error_code
              - column:
                  name: language_code

        - createIndex:
            indexName: idx_error_messages_category
            tableName: validation_error_messages
            columns:
              - column:
                  name: category

  - changeSet:
      id: 001-create-validation-cache-table
      author: harley hoang
      changes:
        - createTable:
            tableName: validation_cache
            remarks: Cache for frequently validated data to improve performance
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  remarks: Primary key using UUIDv7
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cache_key
                  type: varchar(255)
                  remarks: Unique cache key
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: entity_type
                  type: varchar(100)
                  remarks: Type of cached entity
                  constraints:
                    nullable: false
              - column:
                  name: validation_result
                  type: boolean
                  remarks: Cached validation result
                  constraints:
                    nullable: false
              - column:
                  name: cached_errors
                  type: json
                  remarks: Cached validation errors
              - column:
                  name: hit_count
                  type: bigint
                  remarks: Number of times this cache was hit
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  remarks: When cache entry was created
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp
                  remarks: When cache entry expires
                  constraints:
                    nullable: false
              - column:
                  name: last_accessed_at
                  type: timestamp
                  remarks: Last time cache was accessed
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_validation_cache_entity_type
            tableName: validation_cache
            columns:
              - column:
                  name: entity_type

        - createIndex:
            indexName: idx_validation_cache_expires
            tableName: validation_cache
            columns:
              - column:
                  name: expires_at

        - createIndex:
            indexName: idx_validation_cache_hit_count
            tableName: validation_cache
            columns:
              - column:
                  name: hit_count
                  descending: true
