databaseChangeLog:
  # Seed operator categories
  - changeSet:
      id: 022-seed-operator-categories
      author: harley hoang
      changes:
        # Audience Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-audience-001" }
              - column: { name: code, value: "audience" }
              - column: { name: name, value: "Audience" }
              - column: { name: display_order, valueNumeric: 1 }
              - column: { name: icon, value: "people" }
              - column: { name: description, value: "Target specific customer segments and loyalty tiers" }
              - column: { name: is_metadata_category, valueBoolean: false }
              - column: { name: is_active, valueBoolean: true }

        # Products Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-products-001" }
              - column: { name: code, value: "products" }
              - column: { name: name, value: "Products" }
              - column: { name: display_order, valueNumeric: 2 }
              - column: { name: icon, value: "shopping_cart" }
              - column: { name: description, value: "Filter by product attributes in order items" }
              - column: { name: is_metadata_category, valueBoolean: false }
              - column: { name: is_active, valueBoolean: true }

        # Prices & Quantities Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-prices-001" }
              - column: { name: code, value: "prices_quantities" }
              - column: { name: name, value: "Prices & Quantities" }
              - column: { name: display_order, valueNumeric: 3 }
              - column: { name: icon, value: "attach_money" }
              - column: { name: description, value: "Set price and quantity thresholds" }
              - column: { name: is_metadata_category, valueBoolean: false }
              - column: { name: is_active, valueBoolean: true }

        # Budget Constraints Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-budget-001" }
              - column: { name: code, value: "budget_constraints" }
              - column: { name: name, value: "Budget constraints" }
              - column: { name: display_order, valueNumeric: 4 }
              - column: { name: icon, value: "account_balance" }
              - column: { name: description, value: "Limit redemptions and budget usage" }
              - column: { name: is_metadata_category, valueBoolean: false }
              - column: { name: is_active, valueBoolean: true }

        # Redemptions Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-redemptions-001" }
              - column: { name: code, value: "redemptions" }
              - column: { name: name, value: "Redemptions" }
              - column: { name: display_order, valueNumeric: 5 }
              - column: { name: icon, value: "redeem" }
              - column: { name: description, value: "Control redemption access and authorization" }
              - column: { name: is_metadata_category, valueBoolean: false }
              - column: { name: is_active, valueBoolean: true }

        # Customer Metadata Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-customer-meta-001" }
              - column: { name: code, value: "customer_metadata" }
              - column: { name: name, value: "Customer metadata" }
              - column: { name: display_order, valueNumeric: 6 }
              - column: { name: icon, value: "person_outline" }
              - column: { name: description, value: "Filter by customer custom attributes" }
              - column: { name: is_metadata_category, valueBoolean: true }
              - column: { name: metadata_schema_type, value: "customer" }
              - column: { name: is_active, valueBoolean: true }

        # Order Metadata Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-order-meta-001" }
              - column: { name: code, value: "order_metadata" }
              - column: { name: name, value: "Order metadata" }
              - column: { name: display_order, valueNumeric: 7 }
              - column: { name: icon, value: "receipt" }
              - column: { name: description, value: "Filter by order custom attributes" }
              - column: { name: is_metadata_category, valueBoolean: true }
              - column: { name: metadata_schema_type, value: "order" }
              - column: { name: is_active, valueBoolean: true }

        # Redemption Metadata Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-redemption-meta-001" }
              - column: { name: code, value: "redemption_metadata" }
              - column: { name: name, value: "Redemption metadata" }
              - column: { name: display_order, valueNumeric: 8 }
              - column: { name: icon, value: "card_giftcard" }
              - column: { name: description, value: "Filter by redemption custom attributes" }
              - column: { name: is_metadata_category, valueBoolean: true }
              - column: { name: metadata_schema_type, value: "redemption" }
              - column: { name: is_active, valueBoolean: true }

        # Custom Event Metadata Category
        - insert:
            tableName: operator_categories
            columns:
              - column: { name: id, value: "cat-event-meta-001" }
              - column: { name: code, value: "custom_event_metadata" }
              - column: { name: name, value: "Custom event metadata" }
              - column: { name: display_order, valueNumeric: 9 }
              - column: { name: icon, value: "event" }
              - column: { name: description, value: "Filter by custom event attributes" }
              - column: { name: is_metadata_category, valueBoolean: true }
              - column: { name: metadata_schema_type, value: "custom_event" }
              - column: { name: is_active, valueBoolean: true }

  # Seed operator options - Audience
  - changeSet:
      id: 022-seed-operator-options-audience
      author: harley hoang
      changes:
        # Customer segment
        - insert:
            tableName: operator_options
            columns:
              - column: { name: id, value: "opt-customer-segment-001" }
              - column: { name: category_id, value: "cat-audience-001" }
              - column: { name: code, value: "customer_segment" }
              - column: { name: name, value: "Customer segment" }
              - column: { name: display_order, valueNumeric: 1 }
              - column: { name: description, value: "Target customers by segment membership" }
              - column: { name: operator_name, value: "customer.in_segment" }
              - column: { name: operator_version, valueNumeric: 1 }
              - column: { name: comparison_type, value: "list" }
              - column: { name: available_comparators, value: '["in", "not_in"]' }
              - column: { name: default_comparator, value: "in" }
              - column: { name: value_type, value: "list" }
              - column: { name: value_source, value: "multi_select" }
              - column: { name: is_active, valueBoolean: true }

        # Customer loyalty tier
        - insert:
            tableName: operator_options
            columns:
              - column: { name: id, value: "opt-customer-tier-001" }
              - column: { name: category_id, value: "cat-audience-001" }
              - column: { name: code, value: "customer_loyalty_tier" }
              - column: { name: name, value: "Customer loyalty tier" }
              - column: { name: display_order, valueNumeric: 2 }
              - column: { name: description, value: "Target customers by loyalty tier" }
              - column: { name: operator_name, value: "customer.tier.equals" }
              - column: { name: operator_version, valueNumeric: 1 }
              - column: { name: comparison_type, value: "single" }
              - column: { name: available_comparators, value: '["equals", "not_equals", "in", "not_in"]' }
              - column: { name: default_comparator, value: "equals" }
              - column: { name: value_type, value: "string" }
              - column: { name: value_source, value: "select" }
              - column: { name: value_options, value: '[{"value":"BRONZE","label":"Bronze"},{"value":"SILVER","label":"Silver"},{"value":"GOLD","label":"Gold"},{"value":"PLATINUM","label":"Platinum"}]' }
              - column: { name: is_active, valueBoolean: true }

        # Redemption only by code holder
        - insert:
            tableName: operator_options
            columns:
              - column: { name: id, value: "opt-code-holder-001" }
              - column: { name: category_id, value: "cat-audience-001" }
              - column: { name: code, value: "redemption_code_holder_only" }
              - column: { name: name, value: "Redemption only by code holder" }
              - column: { name: display_order, valueNumeric: 3 }
              - column: { name: description, value: "Only the customer who received the code can redeem it" }
              - column: { name: operator_name, value: "redemption.code_holder_only" }
              - column: { name: operator_version, valueNumeric: 1 }
              - column: { name: comparison_type, value: "boolean" }
              - column: { name: available_comparators, value: '["equals"]' }
              - column: { name: default_comparator, value: "equals" }
              - column: { name: value_type, value: "boolean" }
              - column: { name: value_source, value: "input" }
              - column: { name: is_active, valueBoolean: true }

  # Seed operator options - Products
  - changeSet:
      id: 022-seed-operator-options-products
      author: harley hoang
      changes:
        # Any order item
        - insert:
            tableName: operator_options
