databaseChangeLog:
  # Add missing BaseEntity columns (created_by, updated_by, version) to tables

  - changeSet:
      id: 004-add-base-entity-columns-to-rule-usage-limits
      author: claude
      changes:
        - addColumn:
            tableName: rule_usage_limits
            columns:
              - column:
                  name: created_by
                  type: varchar(50)
                  remarks: Creator
              - column:
                  name: updated_by
                  type: varchar(50)
                  remarks: Last updater
              - column:
                  name: version
                  type: bigint
                  remarks: Optimistic locking version
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

