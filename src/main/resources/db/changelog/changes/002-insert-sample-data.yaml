                  name: rule_name
                  value: Customer Email Pattern Validation
              - column:
                  name: rule_type
                  value: PATTERN
              - column:
                  name: target_entity
                  value: Customer
              - column:
                  name: target_field
                  value: email
              - column:
                  name: validation_expression
                  value: ^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
              - column:
                  name: error_code
                  value: VAL_ERR_005
              - column:
