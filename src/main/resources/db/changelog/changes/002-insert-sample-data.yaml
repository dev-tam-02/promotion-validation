  - changeSet:
      id: 002-insert-validation-schemas
      author: harley hoang
      changes:
        - insert:
            tableName: validation_schemas
            columns:
              - column:
                  name: id
                  value: 01932b6f-9abc-7000-8000-000000000001
              - column:
                  name: schema_name
                  value: CustomerValidation
              - column:
                  name: schema_namespace
                  value: vn.viettel.vds.promotion.validation.domain
              - column:
                  name: schema_version
                  value: 1.0.0
              - column:
                  name: schema_type
                  value: AVRO
              - column:
                  name: schema_content
                  value: |
                    {
                      "namespace": "vn.viettel.vds.promotion.validation.domain",
                      "type": "record",
                      "name": "CustomerValidation",
                      "fields": [
                        {"name": "customerId", "type": "string"},
                        {"name": "email", "type": ["null", "string"], "default": null},
                        {"name": "phoneNumber", "type": "string"},
                        {"name": "status", "type": {"type": "enum", "name": "CustomerStatus", "symbols": ["ACTIVE", "INACTIVE", "SUSPENDED", "DELETED"]}}
                      ]
                    }
              - column:
                  name: description
                  value: Avro schema for customer validation
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: compatibility_mode
                  value: BACKWARD

        - insert:
            tableName: validation_schemas
            columns:
              - column:
                  name: id
                  value: 01932b6f-9abc-7000-8000-000000000002
              - column:
                  name: schema_name
                  value: OrderValidation
              - column:
                  name: schema_namespace
                  value: vn.viettel.vds.promotion.validation.domain
              - column:
                  name: schema_version
                  value: 1.0.0
              - column:
                  name: schema_type
                  value: AVRO
              - column:
                  name: schema_content
                  value: |
                    {
                      "namespace": "vn.viettel.vds.promotion.validation.domain",
                      "type": "record",
                      "name": "OrderValidation",
                      "fields": [
                        {"name": "orderId", "type": "string"},
                        {"name": "customerId", "type": "string"},
                        {"name": "totalAmount", "type": "double"},
                        {"name": "orderDate", "type": "long", "logicalType": "timestamp-millis"}
                      ]
                    }
              - column:
                  name: description
                  value: Avro schema for order validation
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: compatibility_mode
                  value: BACKWARD

        - insert:
            tableName: validation_schemas
            columns:
              - column:
                  name: id
                  value: 01932b6f-9abc-7000-8000-000000000003
              - column:
                  name: schema_name
                  value: ProductValidation
              - column:
                  name: schema_namespace
                  value: vn.viettel.vds.promotion.validation.domain
              - column:
                  name: schema_version
                  value: 1.0.0
              - column:
                  name: schema_type
                  value: JSON
              - column:
                  name: schema_content
                  value: |
                    {
                      "$schema": "http://json-schema.org/draft-07/schema#",
                      "type": "object",
                      "properties": {
                        "productId": {"type": "string"},
                        "productName": {"type": "string", "minLength": 3, "maxLength": 255},
                        "price": {"type": "number", "minimum": 0},
                        "category": {"type": "string"}
                      },
                      "required": ["productId", "productName", "price"]
                    }
              - column:
                  name: description
                  value: JSON schema for product validation
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: compatibility_mode
                  value: FULL

