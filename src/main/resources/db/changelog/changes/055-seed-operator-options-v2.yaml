  - changeSet:
      id: 055-seed-operator-options-v2-budget
      author: pp-validation
      comment: "Seed Budget constraints operator_options (17 rules — number input, is_more_than/is_exactly/is_less_than)"
      # All Budget rules share the same shape — define once via SQL for brevity.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- 17 budget rules: same operators (is_more_than, is_exactly, is_less_than), loader number-input.
              INSERT INTO operator_options
                (id, category_id, code, name, name_vi, display_order, operator_name,
                 comparison_type, available_comparators, default_comparator,
                 value_type, value_source, data_loader_type, min_value,
                 label_en, label_vi, is_active)
              VALUES
                ('opt-total-orders-value','cat-budget-constraints','total_orders_value','Total orders value','Tổng giá trị đơn hàng',1,'budget.orders_value.total.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Amount','Giá trị',true),
                ('opt-total-discounted-amount','cat-budget-constraints','total_discounted_amount','Total discounted amount','Tổng tiền đã giảm',2,'budget.discounted_amount.total.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Amount','Giá trị',true),
                ('opt-total-num-redemptions','cat-budget-constraints','total_number_of_redemptions','Total number of redemptions','Tổng số lượt sử dụng',3,'budget.redemptions.total.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Count','Số lượng',true),
                ('opt-total-num-redemptions-per-day','cat-budget-constraints','total_number_of_redemptions_per_day','Total number of redemptions per day','Tổng số lượt sử dụng/ngày',4,'budget.redemptions.per_day.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Count','Số lượng',true),
                ('opt-total-num-redemptions-per-month','cat-budget-constraints','total_number_of_redemptions_per_month','Total number of redemptions per month','Tổng số lượt sử dụng/tháng',5,'budget.redemptions.per_month.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Count','Số lượng',true),
                ('opt-total-num-redemptions-per-week','cat-budget-constraints','total_number_of_redemptions_per_week','Total number of redemptions per week','Tổng số lượt sử dụng/tuần',6,'budget.redemptions.per_week.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Count','Số lượng',true),
                ('opt-redemptions-per-incentive-per-day','cat-budget-constraints','redemptions_per_incentive_per_day','Redemptions per incentive per day','Lượt đổi/ưu đãi/ngày',7,'budget.redemptions.per_incentive.per_day.lte','single','["is_more_than","is_exactly","is_less_than"]','is_less_than','number','input','number-input',0,'Count','Số lượng',true),
