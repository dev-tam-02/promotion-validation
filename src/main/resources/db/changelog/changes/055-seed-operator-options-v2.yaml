databaseChangeLog:
  # Seed v2 — 31 operator_options across 5 static categories.
  #
  # Comparator semantics:
  #   is / is_not                       → equality (translator .equals / .not_equals)
  #   is_more_than / is_less_than       → strict (TODO: needs .gt/.lt translators,
  #                                        currently best-fit to .gte/.lte — see P4b)
  #   is_more_than_or_equal_to / ..le   → .gte / .lte
  #   is_exactly                        → .equals
  #   in / not_in                       → .in / .not_in
  #   from                              → membership in collection (Products only)
  #   contains / exists / before / ...  → metadata-only, see P4a
  #
  # data_loader_type contract — see migration 052.
  - changeSet:
      id: 055-seed-operator-options-v2-audience
      author: pp-validation
      comment: "Seed Audience operator_options (2 rules)"
      changes:
        - insert:
            tableName: operator_options
            columns:
              - column: { name: id, value: "opt-customer-segment" }
              - column: { name: category_id, value: "cat-audience" }
              - column: { name: code, value: "customer_segment" }
              - column: { name: name, value: "Customer segment" }
              - column: { name: name_vi, value: "Tập khách hàng" }
              - column: { name: display_order, valueNumeric: 1 }
              - column: { name: description, value: "The customer must meet the defined conditions regarding the customer segment." }
              - column: { name: description_vi, value: "Khách hàng phải thuộc/không thuộc tập khách hàng đã chọn." }
              - column: { name: operator_name, value: "customer.in_segment" }
              - column: { name: comparison_type, value: "list" }
              - column: { name: available_comparators, value: '["is","is_not"]' }
              - column: { name: default_comparator, value: "is" }
              - column: { name: value_type, value: "list" }
              - column: { name: value_source, value: "multi_select" }
              - column: { name: data_loader_type, value: "pp-segment" }
              - column: { name: data_loader_config, value: '{"multi":true,"searchable":true}' }
              - column: { name: data_source_type, value: "SEGMENT" }
              - column: { name: data_source_endpoint, value: "/api/segments" }
              - column: { name: label_en, value: "Select segments" }
              - column: { name: label_vi, value: "Chọn tập khách hàng" }
              - column: { name: is_active, valueBoolean: true }

        - insert:
            tableName: operator_options
            columns:
              - column: { name: id, value: "opt-redemption-code-holder-only" }
              - column: { name: category_id, value: "cat-audience" }
              - column: { name: code, value: "redemption_by_code_holder_only" }
              - column: { name: name, value: "Redemption only by code holder" }
              - column: { name: name_vi, value: "Chỉ người giữ mã được sử dụng" }
              - column: { name: display_order, valueNumeric: 2 }
              - column: { name: operator_name, value: "redemption.code_holder_only" }
              - column: { name: comparison_type, value: "boolean" }
              - column: { name: available_comparators, value: '["is"]' }
              - column: { name: default_comparator, value: "is" }
              - column: { name: value_type, value: "boolean" }
              - column: { name: value_source, value: "select" }
              - column: { name: data_loader_type, value: "boolean" }
              - column: { name: data_loader_config, value: '{"trueLabel":{"en":"True","vi":"Có"},"falseLabel":{"en":"False","vi":"Không"}}' }
              - column: { name: label_en, value: "Code holder only" }
              - column: { name: label_vi, value: "Chỉ người giữ mã" }
              - column: { name: is_active, valueBoolean: true }

      rollback:
        - delete: { tableName: operator_options, where: "id in ('opt-customer-segment','opt-redemption-code-holder-only')" }

