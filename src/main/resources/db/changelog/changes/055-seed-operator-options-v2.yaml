              - column: { name: default_comparator, value: "is" }
              - column: { name: value_type, value: "list" }
              - column: { name: value_source, value: "multi_select" }
              - column: { name: data_loader_type, value: "pp-product" }
              - column: { name: data_loader_config, value: '{"multi":true,"grouped":true,"groupBy":"type","sources":["sku","product","collection"]}' }
