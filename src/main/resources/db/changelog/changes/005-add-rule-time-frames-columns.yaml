databaseChangeLog:
  # Add missing columns to rule_time_frames table to match entity and database spec
  - changeSet:
      id: 005-add-time-frame-id-column
      author: harley hoang
      changes:
        - addColumn:
            tableName: rule_time_frames
            columns:
              - column:
                  name: time_frame_id
                  type: varchar(100)
                  remarks: ID of the time frame
                  afterColumn: validation_rule_id
                  constraints:
                    nullable: true  # Initially nullable for existing rows
        - sql:
            sql: UPDATE rule_time_frames SET time_frame_id = id WHERE time_frame_id IS NULL
        - addNotNullConstraint:
            tableName: rule_time_frames
            columnName: time_frame_id
            columnDataType: varchar(100)

  - changeSet:
      id: 005-add-mode-column
      author: harley hoang
      changes:
        - addColumn:
            tableName: rule_time_frames
            columns:
              - column:
                  name: mode
                  type: varchar(20)
                  remarks: Time frame mode (ALLOW or DENY for blackout)
                  afterColumn: time_frame_id
                  defaultValue: ALLOW
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-add-rule-time-frames-time-frame-id-index
      author: harley hoang
      changes:
        - createIndex:
            indexName: idx_rule_time_frames_frame_id
            tableName: rule_time_frames
            columns:
              - column:
                  name: time_frame_id
