databaseChangeLog:
  - changeSet:
      id: 010-add-bundle-hash-to-validation-rules
      author: harley hoang
      comment: Add bundle_hash column to validation_rules table for storing compiled rule bundle hash
      changes:
        - addColumn:
            tableName: validation_rules
            columns:
              - column:
                  name: bundle_hash
                  type: VARCHAR(200)
                  remarks: Hash of the compiled rule bundle from validation-engine

        - createIndex:
            indexName: idx_validation_rules_bundle_hash
            tableName: validation_rules
            columns:
              - column:
                  name: bundle_hash
