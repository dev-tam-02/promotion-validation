databaseChangeLog:
  # ============================================================================
  # T13: Seed 6 counter operator_options + 5 reason codes
  #
  # 5 counter budget operators (emit QuotaPolicy via T11 translators):
  #   1. budget.redemptions.per_incentive.per_day.lte
  #   2. budget.redemptions.per_incentive.per_month.lte
  #   3. budget.redemptions.per_customer.in_campaign.lte
  #   4. budget.redemptions.per_customer.in_campaign.per_day.lte
  #   5. budget.redemptions.per_customer.in_campaign.per_month.lte
  #
  # 1 loyalty points cap:
  #   6. customer.loyalty.points.lte  (MAXIMUM_PAY_WITH_POINTS)
  #
  # All 5 counter reason codes follow pattern: QUOTA_EXCEEDED_<UPPER>
  # ============================================================================

  # --------------------------------------------------------------------------
  # 1. redemptions_per_incentive_per_day
  # --------------------------------------------------------------------------
  - changeSet:
      id: 042-seed-counter-red-incentive-day
      author: harley hoang
      comment: Seed operator_option + reason code for budget.redemptions.per_incentive.per_day.lte
      changes:
        - insert:
            tableName: operator_options
            columns:
              - column: { name: id, value: "opt-red-incentive-day-001" }
              - column: { name: category_id, value: "cat-budget-001" }
              - column: { name: code, value: "redemptions_per_incentive_per_day" }
              - column: { name: name, value: "Daily redemptions per incentive" }
              - column: { name: name_vi, value: "Lượt đổi/ưu đãi/ngày" }
              - column: { name: display_order, valueNumeric: 100 }
              - column: { name: description, value: "Maximum number of total redemptions for a given incentive in a single day" }
              - column: { name: description_vi, value: "Số lượt đổi tối đa cho một ưu đãi trong 1 ngày." }
              - column: { name: operator_name, value: "budget.redemptions.per_incentive.per_day.lte" }
              - column: { name: operator_version, valueNumeric: 1 }
              - column: { name: comparison_type, value: "single" }
              - column: { name: available_comparators, value: '["lte"]' }
              - column: { name: default_comparator, value: "lte" }
              - column: { name: value_type, value: "number" }
              - column: { name: value_source, value: "input" }
              - column: { name: input_type, value: "number" }
              - column: { name: min_value, valueNumeric: 1 }
              - column: { name: input_step, value: "1" }
              - column: { name: label_en, value: "Daily limit" }
              - column: { name: label_vi, value: "Hạn mức/ngày" }
              - column: { name: placeholder_en, value: "e.g. 100" }
              - column: { name: placeholder_vi, value: "VD: 100" }
              - column: { name: is_active, valueBoolean: true }
              - column: { name: created_at, valueDate: "2026-01-01T00:00:00" }
              - column: { name: updated_at, valueDate: "2026-01-01T00:00:00" }

        - insert:
            tableName: reason_codes
            columns:
              - column: { name: id, value: "rc-quota-red-incentive-day-001" }
              - column: { name: code, value: "QUOTA_EXCEEDED_REDEMPTIONS_PER_INCENTIVE_PER_DAY" }
              - column: { name: display_message, value: '{"vi":"Đã vượt hạn mức số lượt đổi theo ngày cho ưu đãi này","en":"Daily redemption quota per incentive exceeded"}' }
              - column: { name: severity, value: "ERROR" }
              - column: { name: active, valueBoolean: true }
              - column: { name: created_at, valueDate: "2026-01-01T00:00:00" }
              - column: { name: updated_at, valueDate: "2026-01-01T00:00:00" }

      rollback:
        - delete:
            tableName: operator_options
            where: "id = 'opt-red-incentive-day-001'"
        - delete:
            tableName: reason_codes
            where: "id = 'rc-quota-red-incentive-day-001'"

