version: '3.8'

networks:
  promix-network:
    external: true

services:
  validation:
    build:
      context: .
      dockerfile: Dockerfile
    image: validation-service:latest
    container_name: validation-service
    restart: unless-stopped
    networks:
      - promix-network
    environment:
      # MariaDB Configuration (validation dùng MariaDB cho validation rules/metadata)
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/validation?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123123a@

      # Kafka Cluster Configuration
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka-1:9092,kafka-2:9092,kafka-3:9092

      # Redis Cluster Configuration
      - PROMIX_CACHE_REDISSON_CONFIG_CLUSTER_NODES_ADDRESSES=redis://node1:6379,redis://node2:6380,redis://node3:6381

      # JVM Options
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC

      # Application Configuration
      - SERVER_PORT=8080
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_VN_VIETTEL_VDS=DEBUG

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.validation.rule=Host(`validation.promixhub.com`)"
      - "traefik.http.routers.validation.entrypoints=websecure"
      - "traefik.http.routers.validation.tls=true"
      - "traefik.http.routers.validation.tls.certresolver=letsencrypt"
      - "traefik.http.services.validation.loadbalancer.server.port=8080"
      - "traefik.http.services.validation.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.routers.validation.middlewares=validation-ratelimit,validation-headers"
      - "traefik.http.middlewares.validation-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.validation-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
